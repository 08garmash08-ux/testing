<title>School Simulator</title>
<style>
/* Mobile first. The play area is always exactly the viewport: no page
   scrolling, no pinch zoom, and every control sits inside the safe area so
   notches and gesture bars never cover anything. */

:root {
  --bg: #12151c;
  --panel: rgba(20, 24, 33, 0.88);
  --panel-solid: #1a1f29;
  --line: rgba(255, 255, 255, 0.10);
  --text: #eef1f6;
  --muted: #9aa4b5;
  --accent: #ffd27d;
  --accent-dim: #c9a25c;
  --good: #69c07c;
  --warn: #e0b44c;
  --bad: #e0705c;
  --social: #7fb6f0;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: 100%;
}

#app {
  position: fixed;
  inset: 0;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  image-rendering: pixelated;
  background: #2c3f28;
}

.hidden { display: none !important; }
.muted { color: var(--muted); }
.muted-line { color: var(--muted); font-size: 11px; line-height: 1.3; }

/* ---------- heads-up display ---------- */

#hud {
  position: absolute;
  top: var(--safe-t);
  left: var(--safe-l);
  right: var(--safe-r);
  display: flex;
  gap: 6px;
  padding: 6px 8px;
  pointer-events: none;
  align-items: flex-start;
}

.hud-block {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 5px 9px;
  backdrop-filter: blur(6px);
  min-width: 0;
}

.hud-left { text-align: left; }
.hud-center { flex: 1; text-align: center; overflow: hidden; }
.hud-right { text-align: right; }

#clock { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
#money { font-size: 15px; font-weight: 700; color: var(--accent); line-height: 1.2; }

#period {
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#period.alert { color: var(--bad); }
#room { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hud-buttons { display: flex; gap: 4px; margin-top: 3px; pointer-events: auto; }
.hud-buttons button {
  font: 600 10px/1 ui-sans-serif, system-ui, sans-serif;
  letter-spacing: 0.05em;
  color: var(--text);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 5px 7px;
  cursor: pointer;
}
.hud-buttons button:active { background: rgba(255, 255, 255, 0.2); }

#stats {
  position: absolute;
  top: calc(var(--safe-t) + 56px);
  left: calc(var(--safe-l) + 8px);
  display: flex;
  flex-direction: column;
  gap: 3px;
  pointer-events: none;
}

.chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 2px 6px;
}
.chip-name { font-size: 9px; font-weight: 700; color: var(--muted); width: 16px; }
.chip-track { width: 62px; height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; }
.chip-fill { height: 100%; width: 50%; border-radius: 3px; transition: width 0.25s linear; }
.chip-fill.energy { background: var(--good); }
.chip-fill.stress { background: var(--bad); }
.chip-fill.hunger { background: var(--warn); }
.chip-fill.social { background: var(--social); }
.chip-val { font-size: 10px; font-variant-numeric: tabular-nums; color: var(--muted); width: 20px; text-align: right; }

#hud-warn {
  position: absolute;
  top: calc(var(--safe-t) + 56px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(224, 112, 92, 0.92);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  pointer-events: none;
  animation: pulse 1.8s ease-in-out infinite;
}

@keyframes pulse { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }

#prompt {
  position: absolute;
  bottom: calc(var(--safe-b) + 108px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  pointer-events: none;
  white-space: nowrap;
}

/* ---------- focus minigame ---------- */

#focus-bar {
  position: absolute;
  bottom: calc(var(--safe-b) + 140px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 6px 10px;
  pointer-events: none;
  width: min(300px, 82vw);
}
.focus-title { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; color: var(--muted); }
.focus-track {
  position: relative;
  flex: 1;
  height: 12px;
  background: rgba(255,255,255,0.10);
  border-radius: 6px;
  overflow: hidden;
}
#focus-zone {
  position: absolute;
  top: 0; bottom: 0;
  background: rgba(105, 192, 124, 0.55);
  border-left: 1px solid rgba(255,255,255,0.4);
  border-right: 1px solid rgba(255,255,255,0.4);
}
#focus-marker {
  position: absolute;
  top: -2px; bottom: -2px;
  width: 3px;
  margin-left: -1px;
  background: var(--accent);
  box-shadow: 0 0 6px rgba(255, 210, 125, 0.9);
}
#focus-value { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); width: 38px; text-align: right; }
#focus-bar.good #focus-value { color: var(--good); }
#focus-bar.poor #focus-value { color: var(--bad); }

/* ---------- touch controls ---------- */

#touch {
  position: absolute;
  right: calc(var(--safe-r) + 14px);
  bottom: calc(var(--safe-b) + 18px);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}

.round {
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255, 210, 125, 0.22);
  color: var(--text);
  font: 800 12px/1 ui-sans-serif, system-ui, sans-serif;
  letter-spacing: 0.06em;
  width: 74px;
  height: 74px;
  border-radius: 50%;
  cursor: pointer;
  backdrop-filter: blur(4px);
  touch-action: manipulation;
}
.round:active { background: rgba(255, 210, 125, 0.5); transform: scale(0.95); }
.round.dim { opacity: 0.45; }
.round.small { width: 52px; height: 52px; font-size: 10px; background: rgba(255,255,255,0.12); }
.round.focus { width: 60px; height: 60px; background: rgba(105, 192, 124, 0.3); font-size: 11px; }

/* ---------- toasts ---------- */

#toasts {
  position: absolute;
  left: 50%;
  top: calc(var(--safe-t) + 148px);
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 5px;
  align-items: center;
  pointer-events: none;
  width: min(420px, 92vw);
}

.toast {
  background: var(--panel-solid);
  border: 1px solid var(--line);
  border-left: 3px solid var(--muted);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  animation: slide-in 0.2s ease-out;
  transition: opacity 0.5s ease, transform 0.5s ease;
  max-width: 100%;
  text-align: center;
}
.toast.out { opacity: 0; transform: translateY(-8px); }
.toast-good { border-left-color: var(--good); }
.toast-warn { border-left-color: var(--warn); }
.toast-bad { border-left-color: var(--bad); }
.toast-info { border-left-color: var(--social); }

@keyframes slide-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

/* ---------- modal cards ---------- */

#overlay {
  position: absolute;
  inset: 0;
  background: rgba(8, 10, 15, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(var(--safe-t) + 10px) calc(var(--safe-r) + 10px) calc(var(--safe-b) + 10px) calc(var(--safe-l) + 10px);
  backdrop-filter: blur(3px);
  z-index: 20;
}

.card {
  background: var(--panel-solid);
  border: 1px solid var(--line);
  border-radius: 14px;
  width: min(460px, 100%);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  animation: card-in 0.16s ease-out;
  overflow: hidden;
}
.card-wide { width: min(620px, 100%); }

@keyframes card-in { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }

.card-head { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.card-head h2 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
.card-head p { margin: 5px 0 0; font-size: 12px; }

.card-body {
  padding: 14px 18px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.card-foot {
  padding: 10px 18px calc(12px + var(--safe-b) * 0.3);
  border-top: 1px solid var(--line);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  flex-wrap: wrap;
}

.btn {
  font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
  color: var(--text);
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 16px;
  cursor: pointer;
  min-height: 40px;
}
.btn:active { background: rgba(255,255,255,0.18); }
.btn-primary { background: var(--accent); color: #221a0a; border-color: transparent; font-weight: 700; }
.btn-primary:active { background: var(--accent-dim); }
.btn-small { padding: 6px 12px; min-height: 32px; }
.btn-danger { background: rgba(224, 112, 92, 0.18); border-color: rgba(224,112,92,0.5); color: #ffbcae; margin-top: 6px; }

.lede { margin: 0; font-size: 14px; line-height: 1.5; }
.result { margin: 0; font-size: 14px; line-height: 1.55; }
.speaker { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
.section { margin: 10px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* ---------- option lists ---------- */

.option {
  display: block;
  width: 100%;
  text-align: left;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 13px;
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
  min-height: 44px;
}
.option:active { background: rgba(255,255,255,0.14); }
.option.disabled { opacity: 0.45; cursor: default; }
.option-label {
  font-size: 14px;
  font-weight: 600;
  border-left: 3px solid transparent;
  padding-left: 8px;
  margin-left: -8px;
}
.option-detail { font-size: 11.5px; color: var(--muted); margin-top: 3px; padding-left: 0; }

.choice.right { background: rgba(105,192,124,0.22); border-color: rgba(105,192,124,0.6); }
.choice.wrong { background: rgba(224,112,92,0.22); border-color: rgba(224,112,92,0.6); }
.choice.struck { opacity: 0.4; text-decoration: line-through; }
.choices { display: flex; flex-direction: column; gap: 7px; }

.toggle.on { background: rgba(105,192,124,0.16); border-color: rgba(105,192,124,0.45); }
.menu-grid { display: flex; flex-direction: column; gap: 7px; }

/* ---------- quiz ---------- */

.question { font-size: 15.5px; line-height: 1.45; margin: 2px 0 6px; font-weight: 600; }
.progress { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.25s ease; }
.score { font-size: 42px; margin: 4px 0; text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- stats, grades, people ---------- */

.stat-row { display: flex; align-items: center; gap: 8px; }
.stat-name { font-size: 11px; color: var(--muted); width: 86px; flex: none; }
.stat-track { flex: 1; height: 7px; background: rgba(255,255,255,0.10); border-radius: 4px; overflow: hidden; }
.stat-fill { height: 100%; background: var(--social); border-radius: 4px; }
.stat-val { font-size: 11px; font-variant-numeric: tabular-nums; width: 26px; text-align: right; color: var(--muted); }
.mini-stats { display: flex; flex-direction: column; gap: 5px; padding: 8px 0; }

.grade-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 11px;
}
.grade-name { font-size: 12.5px; font-weight: 600; border-left: 3px solid var(--muted); padding-left: 8px; width: 104px; flex: none; line-height: 1.25; }
.grade-bars { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.grade-bars .stat-name { width: 92px; font-size: 10px; }
.grade-letter { font-size: 24px; font-weight: 800; width: 40px; text-align: center; color: var(--warn); }
.grade-letter.good { color: var(--good); }
.grade-letter.bad { color: var(--bad); }

@media (max-width: 480px) {
  .grade-row { flex-wrap: wrap; }
  .grade-name { width: 100%; }
  .grade-bars { flex: 1 1 60%; }
}

.summary { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.summary-item {
  flex: 1 1 82px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px;
  text-align: center;
}
.summary-item strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.summary-item small { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }

.log-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  padding: 6px 2px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.log-row .ok { color: var(--good); }
.log-row .mid { color: var(--warn); }
.log-row .bad { color: var(--bad); }

.person-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
}
.swatch { width: 12px; height: 34px; border-radius: 4px; flex: none; }
.person-mid { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.person-mid strong { font-size: 13px; }
.person-mid small { font-size: 10.5px; color: var(--muted); }
.perk { color: var(--muted); font-size: 10px; }
.perk.on { color: var(--good); }
.person-val { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }

.plan-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(255,255,255,0.03);
}
.plan-row.now { border-color: var(--accent); background: rgba(255,210,125,0.10); }
.plan-time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; width: 88px; flex: none; }
.plan-mid { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.plan-mid strong { font-size: 13px; }
.plan-mid small { font-size: 10.5px; color: var(--muted); }
.tag { font-size: 9px; font-weight: 800; padding: 3px 7px; border-radius: 999px; letter-spacing: 0.06em; }
.tag-exam { background: var(--bad); color: #1a0d0a; }
.tag-quiz { background: var(--warn); color: #221a06; }

.map-wrap { width: 100%; }
.map-canvas { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; }

.big-gpa { text-align: center; padding: 6px 0 2px; }
.big-gpa strong { display: block; font-size: 46px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.big-gpa small { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

/* ---------- character creation ---------- */

.creator { display: flex; gap: 14px; align-items: flex-start; }
.preview {
  width: 96px;
  height: 120px;
  flex: none;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.fields { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.field input {
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  font: 600 14px/1 inherit;
  padding: 10px;
  min-height: 40px;
}
.look-row { display: flex; align-items: center; gap: 8px; }
.look-label { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.diff-row { display: flex; flex-direction: column; gap: 6px; }
.diff {
  text-align: left;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px 11px;
  color: var(--text);
  cursor: pointer;
  font-family: inherit;
}
.diff.active { border-color: var(--accent); background: rgba(255,210,125,0.12); }
.diff strong { display: block; font-size: 13px; }
.diff small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; line-height: 1.35; }

.help { border-top: 1px solid var(--line); padding-top: 9px; }
.help p { margin: 0 0 5px; font-size: 11.5px; color: var(--muted); line-height: 1.45; }

.keys { display: flex; flex-direction: column; gap: 4px; }
.key-row { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px; padding: 5px 2px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.key-row strong { color: var(--text); flex: none; }
.key-row span { color: var(--muted); text-align: right; }

/* ---------- wider screens ---------- */

@media (min-width: 620px) {
  /* The stat chips sit beside the notifications once there is room. */
  #toasts { top: calc(var(--safe-t) + 92px); width: min(420px, 60vw); }
}

@media (min-width: 760px) {
  #clock { font-size: 22px; }
  #period { font-size: 14px; }
  .muted-line { font-size: 12px; }
  .chip-track { width: 96px; height: 8px; }
  .chip-name, .chip-val { font-size: 11px; }
  .card-head h2 { font-size: 22px; }
  .option-label { font-size: 15px; }
  .question { font-size: 17px; }
}

/* Keyboard and controller players do not need thumb buttons in the way. */
@media (hover: hover) and (pointer: fine) {
  .round { width: 62px; height: 62px; font-size: 11px; opacity: 0.85; }
  .round.small { width: 46px; height: 46px; }
}

@media (max-height: 460px) {
  #stats { top: calc(var(--safe-t) + 50px); }
  .chip-track { width: 48px; }
  #focus-bar { bottom: calc(var(--safe-b) + 96px); }
  #prompt { bottom: calc(var(--safe-b) + 76px); }
  .round { width: 58px; height: 58px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
}

</style>
<div id="app">
  <canvas id="game"></canvas>

  <header id="hud">
    <div class="hud-block hud-left">
      <div id="clock">07:00</div>
      <div id="day" class="muted-line">Day 1</div>
    </div>
    <div class="hud-block hud-center">
      <div id="period">Before school</div>
      <div id="room" class="muted-line">Your Room</div>
    </div>
    <div class="hud-block hud-right">
      <div id="money">$30</div>
      <div class="hud-buttons">
        <button id="btn-map" type="button" title="Campus map">MAP</button>
        <button id="btn-speed" type="button" title="Change speed"><span id="speed-label">1x</span></button>
      </div>
    </div>
  </header>

  <div id="stats">
    <div class="chip"><span class="chip-name">EN</span><div class="chip-track"><div id="bar-energy" class="chip-fill energy"></div></div><span id="stat-energy" class="chip-val">0</span></div>
    <div class="chip"><span class="chip-name">ST</span><div class="chip-track"><div id="bar-stress" class="chip-fill stress"></div></div><span id="stat-stress" class="chip-val">0</span></div>
    <div class="chip"><span class="chip-name">FD</span><div class="chip-track"><div id="bar-hunger" class="chip-fill hunger"></div></div><span id="stat-hunger" class="chip-val">0</span></div>
    <div class="chip"><span class="chip-name">SO</span><div class="chip-track"><div id="bar-social" class="chip-fill social"></div></div><span id="stat-social" class="chip-val">0</span></div>

    { id: 'lunch',   type: 'lunch', start: 660,  end: 720,  label: 'Lunch' },
    { id: 'p4',      type: 'class', start: 720,  end: 770,  slot: 3, label: 'Period 4' },
    { id: 'gap2',    type: 'free',  start: 770,  end: 780,  label: 'Changeover' },
    { id: 'p5',      type: 'class', start: 780,  end: 830,  slot: 4, label: 'Period 5' },
    { id: 'after',   type: 'free',  start: 830,  end: 1440, label: 'After school' }
  ];

  /* Five teaching slots a day, Monday to Friday. */
  var TIMETABLE = [
    ['math', 'science', 'literature', 'history', 'pe'],
    ['science', 'math', 'history', 'literature', 'study'],
    ['literature', 'history', 'math', 'science', 'pe'],
    ['history', 'literature', 'science', 'math', 'study'],
    ['math', 'science', 'literature', 'history', 'quiz']
  ];

  /* Finals take over the whole morning of the last school day. */
  var FINALS_ORDER = ['math', 'science', 'literature', 'history'];

  var ROOM_FOR = {
    math: 'math', science: 'science', literature: 'literature', history: 'history',
    pe: 'gym', study: 'library', quiz: 'literature'

  function isWeekend(dayOfWeek) { return dayOfWeek >= 5; }

  function lastSchoolDay(weeks) { return (weeks - 1) * 7 + 5; }

  function isFinalsDay(state) { return state.day === lastSchoolDay(state.semesterWeeks); }

  function slotSubject(state, slot) {

      return slot < FINALS_ORDER.length ? FINALS_ORDER[slot] : null;
    }
    if (isWeekend(state.dayOfWeek)) return null;
    var row = TIMETABLE[state.dayOfWeek];
    return row ? row[slot] : null;
  }

    var order = ['math', 'science', 'literature', 'history'];

    }
    if (!base) base = PERIODS[PERIODS.length - 1];

    var out = {
      id: base.id, type: base.type, start: base.start, end: base.end,
      label: base.label, slot: base.slot, subject: null, roomId: null,
      exam: false, quiz: false

      out.label = base.type === 'class' ? 'Weekend' : base.label;

    if (base.type !== 'class') return out;

    var subject = slotSubject(state, base.slot);
    if (!subject) { out.type = 'free'; out.label = 'Free period'; return out; }

      out.subject = quizSubjectForWeek(state.week);
      out.roomId = ROOM_FOR[out.subject];
      out.label = 'Pop quiz: ' + SS.Questions.subject(out.subject).name;
      return out;
    }

    if (subject === 'pe') {
      out.subject = 'pe'; out.roomId = 'gym'; out.label = 'Physical education';
      return out;
    }
    if (subject === 'study') {
      out.subject = 'study'; out.roomId = 'library'; out.label = 'Study hall';

        roomId: resolved.roomId,

    var maxDifficulty = kind === 'final' ? 3 : (state.week >= 3 ? 3 : 2);
    var drawn = SS.Questions.draw(rng, subject, count, maxDifficulty);
    var know = state.knowledge[subject] || 0;

    var questions = drawn.map(function (q) {
      /* Revision shows up as one fewer wrong answer to fall for. */
      var eliminate = null;

        prompt: q.q,
        choices: order.map(function (i) { return q.c[i]; }),
        answer: order.indexOf(q.a),
        eliminated: eliminate === null ? -1 : order.indexOf(eliminate),
        picked: -1
      };
    });

    r.done();
    return {
      subject: subject,
      subjectName: SS.Questions.subject(subject).name,
      kind: kind,
      questions: questions,
      index: 0,
      correct: 0,
      finished: false

    c.fillRect(px, py, T, T);
    c.strokeStyle = PALETTE.floorLine;
    c.lineWidth = 1;
    c.strokeRect(px + 0.5, py + 0.5, T - 1, T - 1);
  }

  function paintGrass(c, x, y, px, py) {
    var v = n(x, y);
    c.fillStyle = PALETTE.grass[Math.floor(v * 3) % 3];
    c.fillRect(px, py, T, T);
    c.fillStyle = 'rgba(40,80,35,0.25)';
    for (var i = 0; i < 3; i++) {
      var gx = px + ((v * 971 * (i + 3)) % (T - 4)) + 2;
      var gy = py + ((v * 617 * (i + 5)) % (T - 6)) + 3;
      c.fillRect(gx, gy, 2, 4);
    }
  }

  function paintPath(c, x, y, px, py) {
    c.fillStyle = PALETTE.path[(x * 3 + y) % 2];
    c.fillRect(px, py, T, T);
    c.strokeStyle = 'rgba(90,85,75,0.25)';
    c.strokeRect(px + 0.5, py + 0.5, T - 1, T - 1);
  }

  function paintWall(c, x, y, px, py, glass) {
    var openBelow = !M.solid(x, y + 1);
    c.fillStyle = PALETTE.wall;
    c.fillRect(px, py, T, T);
    c.fillStyle = PALETTE.wallTop;
    c.fillRect(px, py, T, Math.floor(T * 0.42));
    c.fillStyle = PALETTE.wallEdge;
    c.fillRect(px, py + T - 3, T, 3);
    if (glass) {
      c.fillStyle = PALETTE.glass;
      c.fillRect(px + 4, py + 6, T - 8, T - 14);
      c.fillStyle = 'rgba(255,255,255,0.45)';
      c.fillRect(px + 6, py + 8, 5, T - 18);
      c.strokeStyle = PALETTE.wallEdge;
      c.lineWidth = 2;
      c.strokeRect(px + 4, py + 6, T - 8, T - 14);
    }
    if (openBelow) {
      c.fillStyle = 'rgba(0,0,0,0.18)';
      c.fillRect(px, py + T, T, 5);
    }
  }

  function paintDoor(c, x, y, px, py) {
    paintFloor(c, x, y, px, py);
    c.fillStyle = PALETTE.door;
    c.fillRect(px, py, T, T);
    c.fillStyle = PALETTE.doorPanel;
    c.fillRect(px + 3, py + 3, T - 6, T - 6);
    c.fillStyle = PALETTE.wallEdge;
    c.fillRect(px + T - 9, py + T / 2 - 2, 4, 4);
  }

  function paintDesk(c, x, y, px, py) {
    paintFloor(c, x, y, px, py);
    c.fillStyle = 'rgba(0,0,0,0.16)';
    c.fillRect(px + 2, py + 8, T - 2, T - 6);
    c.fillStyle = PALETTE.wood;
    c.fillRect(px, py + 4, T, T - 10);
    c.fillStyle = PALETTE.woodDark;
    c.fillRect(px, py + T - 8, T, 4);
    c.fillStyle = 'rgba(255,255,255,0.18)';
    c.fillRect(px + 2, py + 6, T - 4, 3);
  }

  function paintChair(c, x, y, px, py) {
    paintFloor(c, x, y, px, py);
    c.fillStyle = 'rgba(0,0,0,0.12)';
    c.beginPath();
    c.ellipse(px + T / 2, py + T - 7, T * 0.3, T * 0.14, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#5f6b7a';
    c.fillRect(px + 8, py + 10, T - 16, T - 18);
    c.fillStyle = '#48525f';
    c.fillRect(px + 8, py + 6, T - 16, 5);
  }

  function paintBoard(c, x, y, px, py) {
    paintWall(c, x, y, px, py, false);
    c.fillStyle = '#2f5d4a';
    c.fillRect(px, py + 5, T, T - 12);
    c.strokeStyle = '#d8c9a8';
    c.lineWidth = 2;
    c.strokeRect(px + 1, py + 6, T - 2, T - 14);
    c.strokeStyle = 'rgba(255,255,255,0.35)';
    c.lineWidth = 1;
    c.beginPath();
    var v = n(x, y);
    c.moveTo(px + 5, py + 12 + v * 6);
    c.lineTo(px + T - 6, py + 11 + v * 8);
    c.moveTo(px + 5, py + 19 + v * 4);
    c.lineTo(px + T - 10, py + 20 + v * 3);
    c.stroke();
  }

  function paintShelf(c, x, y, px, py) {
    paintFloor(c, x, y, px, py);
    c.fillStyle = PALETTE.woodDark;
    c.fillRect(px, py, T, T);
    for (var row = 0; row < 3; row++) {
      var sy = py + 2 + row * 10;
      c.fillStyle = '#6b4a2c';
      c.fillRect(px + 1, sy + 8, T - 2, 2);
      for (var i = 0; i < 6; i++) {
        var v = n(x, y) * 1000 + row * 37 + i * 13;
        var h = 5 + (v % 4);
        c.fillStyle = PALETTE.book[Math.floor(v) % PALETTE.book.length];
        c.fillRect(px + 2 + i * 5, sy + 8 - h, 4, h);
      }
    }
  }

  function paintCounter(c, x, y, px, py) {
    paintFloor(c, x, y, px, py);
    c.fillStyle = PALETTE.metalDark;
    c.fillRect(px, py + 6, T, T - 6);
    c.fillStyle = PALETTE.metal;
    c.fillRect(px, py + 4, T, 8);
    c.fillStyle = 'rgba(255,255,255,0.3)';
    c.fillRect(px + 2, py + 5, T - 4, 2);
    var v = n(x, y);
    if (v > 0.5) {
      c.fillStyle = '#e0b24a';
      c.fillRect(px + 7, py + 14, T - 14, 7);
      c.fillStyle = '#c98f2f';
      c.fillRect(px + 7, py + 19, T - 14, 2);
    }
  }

  function paintGear(c, x, y, px, py) {
    paintFloor(c, x, y, px, py);
    c.fillStyle = '#3f4650';
    c.fillRect(px + 3, py + 12, T - 6, T - 16);
    c.fillStyle = '#20252c';
    c.fillRect(px + 1, py + 15, 6, 8);
    c.fillRect(px + T - 7, py + 15, 6, 8);
    c.fillStyle = '#6c7683';
    c.fillRect(px + 6, py + 17, T - 12, 4);
  }

  function paintBed(c, x, y, px, py) {
    paintFloor(c, x, y, px, py);
    var top = !M.solid(x, y - 1) || M.at(x, y - 1) !== 'B';
    c.fillStyle = '#7f5a3c';
    c.fillRect(px, py, T, T);
    c.fillStyle = '#c9d6e3';
    c.fillRect(px + 2, py + (top ? 6 : 0), T - 4, T - (top ? 8 : 2));
    if (top) {
      c.fillStyle = '#f2f5f8';
      c.fillRect(px + 4, py + 3, T - 8, 9);
    } else {
      c.fillStyle = '#7a9ec4';
      c.fillRect(px + 2, py, T - 4, T - 6);
      c.fillStyle = 'rgba(255,255,255,0.25)';
      c.fillRect(px + 2, py + 4, T - 4, 2);
    }
  }

  function paintLocker(c, x, y, px, py) {
    paintFloor(c, x, y, px, py);
    c.fillStyle = '#4b6b78';
    c.fillRect(px, py, T, T);
    c.fillStyle = '#5d8090';
    c.fillRect(px + 1, py + 1, T - 2, T - 3);
    c.fillStyle = 'rgba(0,0,0,0.3)';
    for (var i = 0; i < 3; i++) c.fillRect(px + 6, py + 5 + i * 3, T - 12, 2);
    c.fillStyle = '#d8dee2';
    c.fillRect(px + T - 9, py + T / 2, 3, 7);
    c.fillStyle = 'rgba(0,0,0,0.25)';
    c.fillRect(px, py + T - 3, T, 3);
  }

  function paintVending(c, x, y, px, py) {
    paintFloor(c, x, y, px, py);
    c.fillStyle = '#b8392f';
    c.fillRect(px, py, T, T);
    c.fillStyle = '#2b2f36';
    c.fillRect(px + 3, py + 3, T - 12, T - 9);
    for (var r = 0; r < 3; r++) {
      for (var i = 0; i < 3; i++) {
        c.fillStyle = PALETTE.book[(r * 3 + i + Math.floor(n(x, y) * 6)) % PALETTE.book.length];
        c.fillRect(px + 5 + i * 6, py + 5 + r * 7, 4, 5);
      }
    }
    c.fillStyle = '#d8dee2';
    c.fillRect(px + T - 8, py + 6, 4, 10);
  }

  function paintBench(c, x, y, px, py) {
    paintGrass(c, x, y, px, py);
    c.fillStyle = 'rgba(0,0,0,0.18)';
    c.fillRect(px + 2, py + T - 8, T - 4, 5);
    c.fillStyle = PALETTE.wood;
    c.fillRect(px + 1, py + 10, T - 2, 6);
    c.fillRect(px + 1, py + 18, T - 2, 5);
    c.fillStyle = PALETTE.woodDark;
    c.fillRect(px + 3, py + 16, 4, 9);
    c.fillRect(px + T - 7, py + 16, 4, 9);
  }

  function paintTree(c, x, y, px, py) {
    paintGrass(c, x, y, px, py);
    c.fillStyle = 'rgba(0,0,0,0.2)';
    c.beginPath();
    c.ellipse(px + T / 2, py + T - 5, T * 0.34, T * 0.15, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#6b4a2c';
    c.fillRect(px + T / 2 - 3, py + T - 14, 6, 12);
    var v = n(x, y);
    c.fillStyle = v > 0.6 ? '#3f7a3a' : '#468545';
    c.beginPath();
    c.arc(px + T / 2, py + T / 2 - 4, T * 0.42, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = 'rgba(255,255,255,0.12)';
    c.beginPath();
    c.arc(px + T / 2 - 4, py + T / 2 - 9, T * 0.2, 0, Math.PI * 2);
    c.fill();
  }

  function paintFence(c, x, y, px, py) {
    paintGrass(c, x, y, px, py);
    c.fillStyle = '#7b6a55';
    c.fillRect(px, py + 8, T, 4);
    c.fillRect(px, py + 18, T, 4);
    c.fillStyle = '#5f5142';
    c.fillRect(px + 4, py + 2, 5, T - 4);
    c.fillRect(px + T - 9, py + 2, 5, T - 4);
  }

  function paintFountain(c, x, y, px, py) {
    paintGrass(c, x, y, px, py);
    c.fillStyle = '#9aa3ab';
    c.fillRect(px, py, T, T);
    c.fillStyle = '#5da3c4';
    c.fillRect(px + 3, py + 3, T - 6, T - 6);
    c.fillStyle = 'rgba(255,255,255,0.35)';
    c.fillRect(px + 5, py + 5, T - 20, 4);
  }

  function paintHoop(c, x, y, px, py) {
    paintPath(c, x, y, px, py);
    c.fillStyle = '#4a4f57';
    c.fillRect(px + T / 2 - 2, py + 10, 4, T - 12);
    c.fillStyle = '#e8e4da';
    c.fillRect(px + 5, py + 2, T - 10, 12);
    c.strokeStyle = '#c0504d';
    c.lineWidth = 2;
    c.strokeRect(px + 10, py + 8, T - 20, 6);
  }

  function paintPlant(c, x, y, px, py) {
    var outdoors = !M.roomAt(x, y).indoor;
    if (outdoors) paintGrass(c, x, y, px, py); else paintFloor(c, x, y, px, py);
    c.fillStyle = '#a5643c';
    c.fillRect(px + 9, py + T - 12, T - 18, 10);
    c.fillStyle = '#4f8f4a';
    c.beginPath();
    c.arc(px + T / 2, py + T / 2 - 2, T * 0.3, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#5da157';
    c.beginPath();
    c.arc(px + T / 2 - 5, py + T / 2 - 7, T * 0.18, 0, Math.PI * 2);
    c.fill();
  }

  var PAINTERS = {
    '.': paintFloor, ',': paintGrass, '_': paintPath, 'D': paintDoor,
    'T': paintDesk, 'c': paintChair, 'W': paintBoard, 'S': paintShelf,
    'F': paintCounter, 'G': paintGear, 'B': paintBed, 'L': paintLocker,
    'V': paintVending, '=': paintBench, 't': paintTree, 'f': paintFence,
    '~': paintFountain, 'o': paintHoop, 'P': paintPlant
  };

  function buildBase() {
    base = document.createElement('canvas');
    base.width = M.WIDTH * T;
    base.height = M.HEIGHT * T;
    baseCtx = base.getContext('2d');
    var c = baseCtx;
    c.fillStyle = '#4c7040';
    c.fillRect(0, 0, base.width, base.height);

    for (var y = 0; y < M.HEIGHT; y++) {
      for (var x = 0; x < M.WIDTH; x++) {
        var ch = M.at(x, y);
        var px = x * T, py = y * T;
        if (ch === '#' || ch === '|') { paintWall(c, x, y, px, py, ch === '|'); continue; }
        var fn = PAINTERS[ch];
        if (fn) fn(c, x, y, px, py); else paintFloor(c, x, y, px, py);
      }
    }

    /* Court markings, painted over the finished pavement. */
    var court = M.roomById('court');
    c.save();
    c.strokeStyle = 'rgba(255,255,255,0.55)';
    c.lineWidth = 3;
    c.strokeRect(court.x0 * T + 6, court.y0 * T + 6, (court.x1 - court.x0 + 1) * T - 12, (court.y1 - court.y0 + 1) * T - 12);
    c.beginPath();
    c.moveTo(court.x0 * T + 6, (court.y0 + court.y1) / 2 * T + T / 2);
    c.lineTo((court.x1 + 1) * T - 6, (court.y0 + court.y1) / 2 * T + T / 2);
    c.stroke();
    c.beginPath();
    c.arc(((court.x0 + court.x1) / 2 + 0.5) * T, ((court.y0 + court.y1) / 2 + 0.5) * T, T * 1.8, 0, Math.PI * 2);
    c.stroke();
    c.restore();

    /* Room names, faint, so a new player can orient without a legend. */
    c.save();
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    for (var i = 0; i < M.ROOMS.length; i++) {
      var r = M.ROOMS[i];
      if (r.id === 'yard') continue;
      var cx = ((r.x0 + r.x1) / 2 + 0.5) * T;
      var cy = (r.y0 + 0.9) * T;
      c.font = 'bold 13px system-ui, sans-serif';
      c.fillStyle = 'rgba(30,24,18,0.30)';
      c.fillText(r.name.toUpperCase(), cx, cy + 1);
      c.fillStyle = 'rgba(255,255,255,0.35)';
      c.fillText(r.name.toUpperCase(), cx, cy);
    }
    c.restore();
  }

  /* ---------- people ---------- */

  var LOOKS = [
    { skin: '#e8b98f', shirt: '#4f7fd6', trousers: '#37415a', hair: '#3a2a1c' },
    { skin: '#8d5a3b', shirt: '#d95f7a', trousers: '#2e3550', hair: '#1d1410' },
    { skin: '#f0cdaa', shirt: '#57b487', trousers: '#414a5c', hair: '#8a5a2b' },
    { skin: '#5d3a26', shirt: '#e8b545', trousers: '#2b3346', hair: '#120c08' },
    { skin: '#d8a273', shirt: '#9b6fd4', trousers: '#333b4e', hair: '#5a3418' },
    { skin: '#f6ddc3', shirt: '#e2714a', trousers: '#3d4457', hair: '#c9903f' }
  ];

  function drawPerson(c, px, py, dir, bob, look, scale) {
    var s = scale || 1;
    var step = Math.sin(bob) * 2 * s;
    c.save();
    c.translate(px, py);

    c.fillStyle = 'rgba(0,0,0,0.25)';
    c.beginPath();
    c.ellipse(0, 12 * s, 9 * s, 4 * s, 0, 0, Math.PI * 2);
    c.fill();

    /* legs */
    c.fillStyle = look.trousers;
    c.fillRect(-6 * s, 4 * s + step * 0.4, 5 * s, 9 * s - step * 0.4);
    c.fillRect(1 * s, 4 * s - step * 0.4, 5 * s, 9 * s + step * 0.4);

    /* body */
    c.fillStyle = look.shirt;
    c.beginPath();
    var r = 3 * s;
    var bx = -8 * s, by = -6 * s, bw = 16 * s, bh = 12 * s;
    c.moveTo(bx + r, by);
    c.arcTo(bx + bw, by, bx + bw, by + bh, r);
    c.arcTo(bx + bw, by + bh, bx, by + bh, r);
    c.arcTo(bx, by + bh, bx, by, r);
    c.arcTo(bx, by, bx + bw, by, r);
    c.fill();

    /* arms */
    c.fillStyle = look.skin;
    c.fillRect(-10 * s, -4 * s - step * 0.3, 3 * s, 9 * s);
    c.fillRect(7 * s, -4 * s + step * 0.3, 3 * s, 9 * s);

    /* head */
    c.fillStyle = look.skin;
    c.beginPath();
    c.arc(0, -13 * s, 7 * s, 0, Math.PI * 2);
    c.fill();

    /* hair, shaped by facing */
    c.fillStyle = look.hair;
    c.beginPath();
    if (dir === 'up') {
      c.arc(0, -13 * s, 7.2 * s, 0, Math.PI * 2);
    } else {
      c.arc(0, -14 * s, 7.2 * s, Math.PI * 1.05, Math.PI * 1.95);
      c.lineTo(6 * s, -12 * s);
      c.lineTo(-6 * s, -12 * s);
    }
    c.fill();

    if (dir !== 'up') {
      c.fillStyle = '#231a14';
      var ex = dir === 'left' ? -2.5 : dir === 'right' ? 2.5 : 0;
      c.fillRect((ex - 3) * s, -13.5 * s, 1.8 * s, 2.2 * s);
      c.fillRect((ex + 1.4) * s, -13.5 * s, 1.8 * s, 2.2 * s);
    }
    c.restore();
  }

  function npcLook(npc) {
    return { skin: '#e2b18a', shirt: npc.data.color, trousers: '#3b4252', hair: npc.data.hair || '#2a2018' };
  }

  /* ---------- lighting ---------- */

  function skyTint(minutes) {
    var m = minutes;
    if (m < 300) return { c: '20,28,58', a: 0.55 };
    if (m < 420) return { c: '70,60,90', a: u.lerp(0.55, 0.18, (m - 300) / 120) };
    if (m < 540) return { c: '255,190,120', a: u.lerp(0.18, 0.0, (m - 420) / 120) };
    if (m < 1020) return { c: '255,255,255', a: 0 };
    if (m < 1140) return { c: '255,150,80', a: u.lerp(0, 0.2, (m - 1020) / 120) };
    if (m < 1260) return { c: '60,55,95', a: u.lerp(0.2, 0.5, (m - 1140) / 120) };
    return { c: '20,28,58', a: 0.55 };
  }

  /* ---------- frame ---------- */

  function resize(canvas) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(320, Math.round(rect.width));
    var h = Math.max(240, Math.round(rect.height));
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    view.w = w; view.h = h; view.dpr = dpr;
    /* Narrow screens zoom in so the character stays readable under a thumb;
       wide ones pull back so you can see more of the corridor ahead. */
    var minTilesX = w < 520 ? 9 : 13;
    var minTilesY = h < 520 ? 8 : 12;
    view.scale = u.clamp(Math.min(w / (minTilesX * T), h / (minTilesY * T)), 0.85, 3.0);
  }

  function worldToScreen(wx, wy) {
    return {
      x: (wx * T - camera.x) * view.scale,
      y: (wy * T - camera.y) * view.scale
    };
  }

  function screenToWorld(sx, sy) {
    return {
      x: (sx / view.scale + camera.x) / T,
      y: (sy / view.scale + camera.y) / T
    };
  }

  function frame(ctx, state, opts) {
    opts = opts || {};
    if (!base) { initNoise(); buildBase(); }
    var player = SS.World.player;
    var scale = view.scale;
    var viewW = view.w / scale, viewH = view.h / scale;

    var targetX = player.x * T - viewW / 2;
    var targetY = player.y * T - viewH / 2;
    camera.x = u.clamp(targetX, 0, Math.max(0, base.width - viewW));
    camera.y = u.clamp(targetY, 0, Math.max(0, base.height - viewH));
    if (base.width < viewW) camera.x = (base.width - viewW) / 2;
    if (base.height < viewH) camera.y = (base.height - viewH) / 2;

    ctx.save();
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#3d5c36';
    ctx.fillRect(0, 0, view.w, view.h);

    ctx.save();
    ctx.scale(scale, scale);
    ctx.translate(-camera.x, -camera.y);

    var sx = Math.max(0, Math.floor(camera.x));
    var sy = Math.max(0, Math.floor(camera.y));
    var sw = Math.min(base.width - sx, Math.ceil(viewW) + 2);
    var sh = Math.min(base.height - sy, Math.ceil(viewH) + 2);
    if (sw > 0 && sh > 0) ctx.drawImage(base, sx, sy, sw, sh, sx, sy, sw, sh);

    /* walk target marker */
    if (player.path && player.pathIndex < player.path.length) {
      var dest = player.path[player.path.length - 1];
      var pulse = 0.5 + Math.sin(performance.now() / 180) * 0.25;
      ctx.strokeStyle = 'rgba(255,255,255,' + pulse.toFixed(2) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc((dest.x + 0.5) * T, (dest.y + 0.5) * T, 9, 0, Math.PI * 2);
      ctx.stroke();
    }

    /* highlight whatever the action button would hit */
    if (opts.target && opts.target.type === 'tile') {
      ctx.strokeStyle = 'rgba(255,229,140,0.9)';
      ctx.lineWidth = 2;
      ctx.strokeRect(opts.target.x * T + 2, opts.target.y * T + 2, T - 4, T - 4);
    }

    /* people, sorted so the ones lower on screen draw in front */
    var actors = [];
    for (var i = 0; i < SS.World.npcs.length; i++) {
      var npc = SS.World.npcs[i];
      if (!npc.visible) continue;
      if (npc.x * T < camera.x - T * 2 || npc.x * T > camera.x + viewW + T * 2) continue;
      if (npc.y * T < camera.y - T * 3 || npc.y * T > camera.y + viewH + T * 3) continue;
      actors.push({ y: npc.y, npc: npc });
    }
    actors.push({ y: player.y, player: true });
    actors.sort(function (a, b) { return a.y - b.y; });

    for (var j = 0; j < actors.length; j++) {
      var a = actors[j];
      if (a.player) {

  }

  function focusUpdate(dt, active) {
    if (active !== focusGame.active) {
      focusGame.active = active;
      if (active) focusReset();
      dom.focusBar.classList.toggle('hidden', !active);
      dom.btnFocus.classList.toggle('hidden', !active);
    }
    if (!active) return;
    focusGame.pos += focusGame.dir * focusGame.speed * dt;
    if (focusGame.pos > 1) { focusGame.pos = 1; focusGame.dir = -1; }
    if (focusGame.pos < 0) { focusGame.pos = 0; focusGame.dir = 1; }
    focusGame.value = u.approach(focusGame.value, 1, dt * 0.06);
    dom.focusZone.style.left = (focusGame.zone * 100).toFixed(1) + '%';
    dom.focusZone.style.width = (focusGame.width * 100).toFixed(1) + '%';
    dom.focusMarker.style.left = (focusGame.pos * 100).toFixed(1) + '%';
    dom.focusValue.textContent = 'x' + focusGame.value.toFixed(2);
    dom.focusBar.classList.toggle('good', focusGame.value >= 1.25);
    dom.focusBar.classList.toggle('poor', focusGame.value < 0.9);

      focusGame.speed = Math.min(1.4, focusGame.speed + 0.06);

      prompt: document.getElementById('prompt'),
      hudWarn: document.getElementById('hud-warn'),
      speedLabel: document.getElementById('speed-label'),
      barEnergy: document.getElementById('bar-energy'),
      barStress: document.getElementById('bar-stress'),
      barHunger: document.getElementById('bar-hunger'),
      barSocial: document.getElementById('bar-social'),
      statEnergy: document.getElementById('stat-energy'),
      statStress: document.getElementById('stat-stress'),
      statHunger: document.getElementById('stat-hunger'),
      statSocial: document.getElementById('stat-social'),
      focusBar: document.getElementById('focus-bar'),
      focusZone: document.getElementById('focus-zone'),
      focusMarker: document.getElementById('focus-marker'),
      focusValue: document.getElementById('focus-value'),
      btnInteract: document.getElementById('btn-interact'),
      btnMenu: document.getElementById('btn-menu'),
      btnFocus: document.getElementById('btn-focus'),
      btnSpeed: document.getElementById('btn-speed'),
      btnMap: document.getElementById('btn-map')
    };

    var stored = SS.Storage.loadSettings();
    for (var k in stored) if (stored.hasOwnProperty(k)) settings[k] = stored[k];
    if (SPEEDS.indexOf(settings.speed) < 0) settings.speed = 1;
    SS.Audio.setSfx(settings.sfx);
    if (settings.music) SS.Audio.setMusic(true);
    dom.touch.classList.toggle('hidden', !settings.touchControls);

    SS.UI.init(dom, api);
    SS.Input.attach(canvas);
    SS.Render.resize(canvas);

    window.addEventListener('resize', function () { SS.Render.resize(canvas); });
    window.addEventListener('orientationchange', function () {
      window.setTimeout(function () { SS.Render.resize(canvas); }, 250);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { save(); lastFrame = performance.now(); }
      else lastFrame = performance.now();
    });

    SS.bus.on('toast', function (p) { SS.UI.toast(p.text, p.kind); });
    SS.bus.on('periodChanged', function (p) {
      if (p.period.type === 'class') SS.Audio.sfx.bell();
      if (p.period.type === 'class' && p.period.roomId) {
        SS.UI.toast(p.period.label + ' in ' + SS.MapData.roomById(p.period.roomId).name, 'info');
      } else if (p.period.type === 'lunch') {
        SS.UI.toast('Lunch', 'info');
      }
      rollEvent('period');
    });
    SS.bus.on('perk', function (p) {
      SS.UI.toast(p.npc.name + ': ' + p.perk.label + ' unlocked', 'good');
      SS.Audio.sfx.good();
    });
    SS.bus.on('collapse', function () {
      if (SS.UI.isOpen()) SS.UI.closeAll();
      SS.UI.screens.collapse(function () {
        state.totals.allNighters++;
        SS.Actions.doSleep(state, 7 * 60, '');
        state.energy = Math.min(state.energy, 62);
        state.stress = Math.min(100, state.stress + 10);
        afterAction();
      });
    });

    lastFrame = performance.now();
    window.requestAnimationFrame(frame);

    /* Something has to be on screen before the first state exists. */
    state = State.create({ difficulty: 'normal' });
    SS.World.init(state, null);
    running = false;
    SS.UI.screens.title(SS.Storage.hasSave());
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  SS.Game = api;
})(window.SS = window.SS || {});

</script>
