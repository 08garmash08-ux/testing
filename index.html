<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mog Your Face</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root{
    --bg:#07080d;
    --panel:#11131d;
    --line:#232741;
    --txt:#e8ebff;
    --dim:#8b90b5;
    --acc:#7cf6c8;
    --acc2:#8b7cff;
    --bad:#ff6b8a;
    --warn:#ffd166;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:
      radial-gradient(900px 600px at 50% -10%, #1b1740 0%, transparent 60%),
      var(--bg);
    color:var(--txt);
    font:15px/1.55 "IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
  h1{
    margin:0;text-align:center;font-family:"Chakra Petch","Segoe UI",sans-serif;
    font-size:clamp(30px,8.5vw,58px);
    letter-spacing:.16em;font-weight:800;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{text-align:center;color:var(--dim);letter-spacing:.3em;font-size:11px;margin:6px 0 22px;text-transform:uppercase}

  .stage{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;overflow:hidden;aspect-ratio:4/3;
    display:flex;align-items:center;justify-content:center;
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  video,canvas#shot{width:100%;height:100%;object-fit:cover;display:block}
  #shot{position:absolute;inset:0}
  video{transform:scaleX(-1)}
  .hidden{display:none!important}

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;
    padding:24px;background:rgba(7,8,13,.72);backdrop-filter:blur(2px);
  }
  .overlay p{color:var(--dim);margin:0;max-width:34ch}
  #count{font-family:"Chakra Petch","Segoe UI",sans-serif;
    font-size:clamp(70px,22vw,150px);font-weight:700;color:var(--acc);
    text-shadow:0 0 40px rgba(124,246,200,.45);line-height:1}
  .cue{position:absolute;top:14px;left:50%;transform:translateX(-50%);
    background:rgba(7,8,13,.75);border:1px solid var(--line);border-radius:999px;
    padding:6px 16px;letter-spacing:.22em;font-size:11px;text-transform:uppercase;color:var(--acc)}

  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  button{
    font:inherit;font-family:"Chakra Petch","Segoe UI",sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:13px 22px;border-radius:12px;border:1px solid var(--line);
    background:#181b2b;color:var(--txt);cursor:pointer;transition:.15s;
  }
  button:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#080a12;border-color:transparent}
  button.ghost{background:transparent}

  #result{margin-top:22px}
  .scorecard{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;
  }
  .big{display:flex;align-items:baseline;justify-content:center;gap:8px}
  .big b{font-family:"Chakra Petch","Segoe UI",sans-serif;font-variant-numeric:tabular-nums;
    font-size:clamp(48px,14vw,84px);line-height:1;font-weight:700;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .big span{color:var(--dim);letter-spacing:.2em;font-size:12px;text-transform:uppercase}
  .verdict{font-family:"Chakra Petch","Segoe UI",sans-serif;text-align:center;margin:10px 0 4px;font-size:18px;font-weight:800;letter-spacing:.08em}
  .flavor{text-align:center;color:var(--dim);margin:0 0 20px}

  .trait{margin:14px 0}
  .trait .top{display:flex;justify-content:space-between;gap:10px;font-size:13px}
  .trait .name{font-weight:700}
  .trait .tag{font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .bar{height:9px;border-radius:99px;background:#1c1f31;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .note{color:var(--dim);font-size:12px;margin-top:4px}
  .ok{color:var(--acc)} .mid{color:var(--warn)} .no{color:var(--bad)}
  .ok i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .mid i{background:linear-gradient(90deg,var(--warn),#ff9f6b)}
  .no i{background:linear-gradient(90deg,var(--bad),#ff9f6b)}

  .best{text-align:center;color:var(--dim);font-size:12px;margin-top:16px;letter-spacing:.1em}
  .err{color:var(--bad)}
  .fileline{color:var(--dim);font-size:12px;text-align:center;margin-top:12px}
  .fileline label{color:var(--acc);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <h1>MOG YOUR FACE</h1>
  <div class="sub">camera &middot; sigma face &middot; shape scan</div>

  <div class="stage">
    <video id="cam" playsinline autoplay muted></video>
    <canvas id="shot" class="hidden"></canvas>
    <div id="cue" class="cue hidden">hold your sigma face</div>

    <div id="intro" class="overlay">
      <p>Point the camera at your face, hit the button, hold your hardest <b>sigma face</b> for the countdown.</p>
      <button id="btnStart" class="primary">Start camera</button>
      <div class="fileline">no camera? <label for="file">use a photo file</label>
        <input id="file" type="file" accept="image/*" class="hidden"></div>
      <p id="camErr" class="err"></p>
    </div>

    <div id="counter" class="overlay hidden"><div id="count">3</div></div>
  </div>

  <div class="row">
    <button id="btnShoot" class="primary hidden">Take photo</button>
    <button id="btnResult" class="primary hidden">See result</button>
    <button id="btnRestart" class="ghost hidden">Restart photo</button>
  </div>

  <div id="result" class="hidden"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cam = $('cam'), shot = $('shot'), ctx = shot.getContext('2d', {willReadFrequently:true});
  const intro = $('intro'), counter = $('counter'), count = $('count'), cue = $('cue');
  const btnStart = $('btnStart'), btnShoot = $('btnShoot'), btnResult = $('btnResult'), btnRestart = $('btnRestart');
  const result = $('result'), camErr = $('camErr'), file = $('file');

  let stream = null, frozen = null;   // frozen = ImageData of the captured shot

  /* ---------- camera ---------- */
  async function startCamera(){
    camErr.textContent = '';
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:960}}, audio:false});
      cam.srcObject = stream;
      await cam.play();
      intro.classList.add('hidden');
      btnShoot.classList.remove('hidden');
      cue.classList.remove('hidden');
    }catch(err){
      camErr.textContent = 'Camera blocked: ' + err.message + ' — serve the page over http://localhost or https, and allow camera access.';
    }
  }
  function stopCamera(){
    if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  /* ---------- capture ---------- */
  async function countdownAndShoot(){
    btnShoot.disabled = true;
    counter.classList.remove('hidden');
    for(const n of ['3','2','1','SIGMA']){
      count.textContent = n;
      count.animate([{transform:'scale(1.4)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:260});
      await new Promise(r => setTimeout(r, 700));
    }
    counter.classList.add('hidden');
    grabFrame();
    btnShoot.disabled = false;
  }

  function grabFrame(){
    const w = cam.videoWidth || 640, h = cam.videoHeight || 480;
    shot.width = w; shot.height = h;
    ctx.save();
    ctx.translate(w, 0); ctx.scale(-1, 1);        // un-mirror so the shot matches the preview
    ctx.drawImage(cam, 0, 0, w, h);
    ctx.restore();
    afterCapture();
  }

  function loadPhoto(f){
    const img = new Image();
    img.onload = () => {
      shot.width = img.naturalWidth; shot.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      intro.classList.add('hidden');
      afterCapture();
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  }

  function afterCapture(){
    frozen = ctx.getImageData(0, 0, shot.width, shot.height);
    shot.classList.remove('hidden');
    cam.classList.add('hidden');
    cue.classList.add('hidden');
    btnShoot.classList.add('hidden');
    btnResult.classList.remove('hidden');
    btnRestart.classList.remove('hidden');
    result.classList.add('hidden');
    result.innerHTML = '';
  }

  /* ---------- restart ---------- */
  function restart(){
    result.classList.add('hidden'); result.innerHTML = '';
    btnResult.classList.add('hidden'); btnRestart.classList.add('hidden');
    shot.classList.add('hidden'); cam.classList.remove('hidden');
    frozen = null;
    if(stream){
      btnShoot.classList.remove('hidden');
      cue.classList.remove('hidden');
    }else{
      intro.classList.remove('hidden');
    }
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* ================= face shape scan =================
     Everything below reads the actual pixels of your shot:
     a skin-tone mask finds the face box, then symmetry and
     edge energy inside that box drive every trait score. */

  function isSkin(r,g,b){
    const y  =  0.299*r + 0.587*g + 0.114*b;
    const cb = -0.169*r - 0.331*g + 0.500*b + 128;
    const cr =  0.500*r - 0.419*g - 0.081*b + 128;
    return y > 40 && cb > 76 && cb < 128 && cr > 132 && cr < 178 && r > g && r > b;
  }

  function faceBox(img){
    const {width:w, height:h, data:d} = img;
    const xs = [], ys = [];
    for(let y = 0; y < h; y += 3){
      for(let x = 0; x < w; x += 3){
        const i = (y*w + x) * 4;
        if(isSkin(d[i], d[i+1], d[i+2])){ xs.push(x); ys.push(y); }
      }
    }
    const sampled = Math.ceil(w/3) * Math.ceil(h/3);
    if(xs.length < sampled * 0.005) return {found:false, reason:'none'};

    xs.sort((a,b) => a-b); ys.sort((a,b) => a-b);
    const q = (arr,p) => arr[Math.floor((arr.length-1)*p)];
    const x0 = q(xs,.06), x1 = q(xs,.94), y0 = q(ys,.04), y1 = q(ys,.96);
    const bw = x1 - x0, bh = y1 - y0;

    // a real face fills its own box; scattered skin-ish walls and furniture do not
    let inside = 0;
    for(let k = 0; k < xs.length; k++){
      if(xs[k] >= x0 && xs[k] <= x1 && ys[k] >= y0 && ys[k] <= y1) inside++;
    }
    const density = inside / Math.max(1, (bw/3) * (bh/3));
    const area = (bw*bh) / (w*h);
    const ratio = bh / Math.max(1, bw);

    if(density < 0.34) return {found:false, reason:'none'};
    if(ratio < 0.75 || ratio > 2.4) return {found:false, reason:'none'};
    if(area < 0.05) return {found:false, reason:'far'};
    return {x0, x1, y0, y1, found:true, fill:area, density};
  }

  // mouth band: teeth and movement give away a normal, friendly face
  function mouthCheck(img, box){
    const {width:w, data:d} = img;
    const bw = box.x1 - box.x0, bh = box.y1 - box.y0;
    const mx0 = Math.round(box.x0 + bw*0.25), mx1 = Math.round(box.x0 + bw*0.75);
    const my0 = Math.round(box.y0 + bh*0.60), my1 = Math.round(box.y0 + bh*0.92);
    let teeth = 0, n = 0, sum = 0, sum2 = 0;
    for(let y = my0; y < my1; y++){
      for(let x = mx0; x < mx1; x++){
        const i = (y*w + x) * 4, r = d[i], g = d[i+1], b = d[i+2];
        const l = 0.299*r + 0.587*g + 0.114*b;
        const sat = Math.max(r,g,b) - Math.min(r,g,b);
        if(l > 195 && sat < 32) teeth++;
        sum += l; sum2 += l*l; n++;
      }
    }
    if(!n) return {teeth:0, sd:0, smiling:false};
    const mean = sum/n, sd = Math.sqrt(Math.max(0, sum2/n - mean*mean));
    const t = teeth/n;
    return {teeth:t, sd, smiling: t > 0.05 || sd > 48};
  }

  // grey patch of the face box, resampled to n x n
  function patch(img, box, n){
    const {width:w, data:d} = img;
    const out = new Float64Array(n*n);
    const bw = box.x1 - box.x0, bh = box.y1 - box.y0;
    for(let j = 0; j < n; j++){
      for(let i = 0; i < n; i++){
        const x = Math.min(w-1, Math.round(box.x0 + bw*(i+.5)/n));
        const y = Math.round(box.y0 + bh*(j+.5)/n);
        const k = (y*w + x) * 4;
        out[j*n+i] = 0.299*d[k] + 0.587*d[k+1] + 0.114*d[k+2];
      }
    }
    return out;
  }

  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const pct = v => Math.round(clamp(v, 0, 1) * 100);

  // mean |gradient| over rows [r0,r1) of an n x n patch
  function edgeEnergy(p, n, r0, r1){
    let s = 0, c = 0;
    for(let j = Math.floor(r0*n); j < Math.floor(r1*n) - 1; j++){
      for(let i = 1; i < n-1; i++){
        const gx = p[j*n+i+1] - p[j*n+i-1];
        const gy = p[(j+1)*n+i] - p[j*n+i];
        s += Math.hypot(gx, gy); c++;
      }
    }
    return c ? s/c : 0;
  }

  function bandContrast(p, n, r0, r1){
    let min = 255, max = 0, sum = 0, sum2 = 0, c = 0;
    for(let j = Math.floor(r0*n); j < Math.floor(r1*n); j++){
      for(let i = 0; i < n; i++){
        const v = p[j*n+i];
        min = Math.min(min,v); max = Math.max(max,v);
        sum += v; sum2 += v*v; c++;
      }
    }
    const mean = sum/c;
    return {range: max-min, sd: Math.sqrt(sum2/c - mean*mean), mean};
  }

  function analyse(img){
    const box = faceBox(img);
    if(!box.found) return {ok:false, reason:box.reason};
    const mouth = mouthCheck(img, box);
    const n = 64, p = patch(img, box, n);

    // symmetry: left half vs mirrored right half
    let diff = 0, cells = 0;
    for(let j = 0; j < n; j++){
      for(let i = 0; i < n/2; i++){
        diff += Math.abs(p[j*n+i] - p[j*n + (n-1-i)]); cells++;
      }
    }
    const symmetry = 1 - clamp((diff/cells) / 46, 0, 1);

    const eyes   = bandContrast(p, n, .26, .44);
    const jawE   = edgeEnergy(p, n, .68, 1.0);
    const cheekE = edgeEnergy(p, n, .44, .66);
    const all    = bandContrast(p, n, 0, 1);

    const bw = box.x1 - box.x0, bh = box.y1 - box.y0;
    const ratio = bh / Math.max(1, bw);
    const harmony = 1 - clamp(Math.abs(ratio - 1.618) / 0.85, 0, 1);   // golden-ratio face

    const traits = [
      { name:'Eye shape',   v: pct(clamp(eyes.sd/44, 0, 1) * .6 + clamp(eyes.range/190, 0, 1) * .4),
        good:'eyes cut sharp, hunter stare locked in', bad:'eyes reading soft and sleepy — narrow them' },
      { name:'Jawline',     v: pct(clamp(jawE/26, 0, 1)),
        good:'jaw carved out of stone', bad:'jaw edge is blurry — push the chin forward' },
      { name:'Cheekbones',  v: pct(clamp(cheekE/22, 0, 1)),
        good:'cheekbones catching light like glass', bad:'cheek shadow flat — turn slightly to the side' },
      { name:'Symmetry',    v: pct(symmetry),
        good:'both halves of the face agree', bad:'one side is winning — straighten up and recentre' },
      { name:'Face harmony',v: pct(harmony),
        good:'proportions sitting near the golden ratio', bad:'face shape is off-ratio for the frame — move closer or back' },
      { name:'Sigma aura',  v: pct(clamp(all.sd/52, 0, 1) * .7 + clamp(box.fill/0.34, 0, 1) * .3),
        good:'zero expression, maximum presence', bad:'aura leaking — stop smiling, get more light' },
    ];

    const weights = [.22, .2, .15, .18, .12, .13];
    const score = Math.round(traits.reduce((s,t,i) => s + t.v*weights[i], 0));
    return {ok:true, box, traits, score, mouth, ratio};
  }

  /* ---------- result ---------- */
  function tierOf(v){ return v >= 85 ? 'ok' : v >= 65 ? 'mid' : 'no'; }
  function scoreTier(v){ return v >= 75 ? 'ok' : v >= 50 ? 'mid' : 'no'; }
  function tagOf(v){ return v >= 85 ? 'perfect' : v >= 65 ? 'solid' : 'not perfect'; }

  function verdictOf(score){
    if(score >= 90) return ['PERFECT SIGMA — TOTAL MOG', 'Nothing to fix. Everyone in the room just got mogged.'];
    if(score >= 75) return ['CERTIFIED MOGGER', 'Strong face game. One shape away from perfect.'];
    if(score >= 60) return ['MID SIGMA', 'You hold your own, but the shapes are not locked in yet.'];
    if(score >= 40) return ['GETTING MOGGED', 'The face is not sigma yet. Retake it with better light.'];
    return ['HARD MOGGED', 'Brutal. Restart the photo and try an actual sigma face.'];
  }

  const NO_SCORE = {
    none: ['NO FACE — NOT SCORED',
      'There is no face in this photo, so nobody mogged anybody. Get in front of the camera and take the photo again.'],
    far: ['FACE TOO FAR — NOT SCORED',
      'Your face is too small in the frame to read any shape. Come closer to the camera and take the photo again.'],
    smile: ['NORMAL FACE — NO MOG',
      'You are smiling. A normal face never mogs anyone — drop the smile, hold a real sigma face and take the photo again.']
  };

  function noScore(kind, traits){
    const [title, msg] = NO_SCORE[kind];
    return `
      <div class="scorecard">
        <div class="big"><b>—</b><span>no mog</span></div>
        <div class="verdict no">${title}</div>
        <p class="flavor">${msg}</p>
        ${traits ? traits.map(t => `
          <div class="trait ${tierOf(t.v)}">
            <div class="top"><span class="name">${t.name}</span>
              <span class="tag">${t.v}% &middot; ${tagOf(t.v)}</span></div>
            <div class="bar"><i data-w="${t.v}"></i></div>
            <div class="note">${t.v >= 75 ? t.good : t.bad}</div>
          </div>`).join('') + '<p class="flavor" style="margin:18px 0 0">Shapes were read, but a smiling face does not count as a mog.</p>' : ''}
      </div>`;
  }

  function showResult(){
    if(!frozen) return;
    const a = analyse(frozen);

    if(!a.ok){ render(noScore(a.reason)); return; }
    if(a.mouth.smiling){ render(noScore('smile', a.traits)); return; }

    const [title, flavor] = verdictOf(a.score);
    const worst = [...a.traits].sort((x,y) => x.v - y.v)[0];
    const perfect = a.traits.filter(t => t.v >= 85).length;

    let best = 0;
    try{ best = Math.max(+(localStorage.getItem('mog-best') || 0), a.score);
         localStorage.setItem('mog-best', best); }catch(e){ best = a.score; }

    render(`
      <div class="scorecard">
        <div class="big"><b>${a.score}%</b><span>mog rating</span></div>
        <div class="verdict ${scoreTier(a.score)}">${title}</div>
        <p class="flavor">${flavor}</p>
        ${a.traits.map(t => `
          <div class="trait ${tierOf(t.v)}">
            <div class="top"><span class="name">${t.name}</span>
              <span class="tag">${t.v}% &middot; ${tagOf(t.v)}</span></div>
            <div class="bar"><i data-w="${t.v}"></i></div>
            <div class="note">${t.v >= 75 ? t.good : t.bad}</div>
          </div>`).join('')}
        <p class="flavor" style="margin:18px 0 0">
          ${perfect} of ${a.traits.length} shapes are perfect.
          ${a.score >= 90 ? 'The whole face is perfect.' : `Weakest shape: <b>${worst.name}</b> — that is the one stopping a perfect face.`}
        </p>
        <div class="best">session best &middot; ${best}%</div>
      </div>`);
  }

  function render(html){
    result.innerHTML = html;
    result.classList.remove('hidden');
    requestAnimationFrame(() => result.querySelectorAll('.bar i')
      .forEach(el => el.style.width = el.dataset.w + '%'));
    result.scrollIntoView({behavior:'smooth', block:'start'});
    btnResult.classList.add('hidden');
  }

  btnStart.addEventListener('click', startCamera);
  btnShoot.addEventListener('click', countdownAndShoot);
  btnResult.addEventListener('click', showResult);
  btnRestart.addEventListener('click', restart);
  file.addEventListener('change', e => { if(e.target.files[0]) loadPhoto(e.target.files[0]); });
  window.addEventListener('pagehide', stopCamera);
})();
</script>
</body>
</html>
