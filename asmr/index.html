<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiet Hands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&family=Young+Serif&display=swap">
<style>
  :root{
    color-scheme: dark;
    --desk:#111916;
    --panel:#18231f;
    --mat:#22433a;
    --edge:rgba(214,236,222,.13);
    --edge-strong:rgba(214,236,222,.28);
    --ink:#e3ebe5;
    --ink-dim:#93a89e;
    --ink-faint:#62786e;
    --peach:#f0bf9b;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--desk);color:var(--ink);
    font:15px/1.5 "Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    height:100%;max-width:1180px;margin:0 auto;
    display:flex;flex-direction:column;gap:10px;
    padding-inline:16px;padding-block:14px 12px;
  }

  header{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  h1{margin:0;font-family:"Young Serif",Georgia,"Times New Roman",serif;font-weight:400;font-size:26px;line-height:1.1;letter-spacing:.005em;text-wrap:balance}
  #viz{width:84px;height:22px;display:block;flex:none}
  .brand p{margin:0;color:var(--ink-dim);font-size:13px}

  .controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .toggle{
    font:inherit;font-size:13px;font-weight:500;color:var(--ink-dim);
    background:transparent;border:1px solid var(--edge);border-radius:999px;padding:6px 13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    transition:background-color .2s,color .2s,border-color .2s;
  }
  .toggle:hover{color:var(--ink)}
  .toggle::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-faint);transition:background-color .2s,box-shadow .2s}
  .toggle[aria-pressed="true"]{color:var(--ink);border-color:var(--edge-strong)}
  .toggle[aria-pressed="true"]::before{background:var(--peach);box-shadow:0 0 8px var(--peach)}

  .dock{
    display:flex;gap:3px;padding:4px;border:1px solid var(--edge);border-radius:14px;background:var(--panel);
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .dock::-webkit-scrollbar{display:none}
  .dock button{
    flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font:inherit;font-size:13px;font-weight:500;color:var(--ink-dim);white-space:nowrap;
    background:transparent;border:0;border-radius:10px;padding:8px 11px;cursor:pointer;
    transition:background-color .2s,color .2s;
  }
  .dock svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .dock kbd{font:10px "DM Mono",ui-monospace,Menlo,monospace;color:var(--ink-faint)}
  .dock button:hover{color:var(--ink);background:rgba(214,236,222,.05)}
  .dock button[aria-pressed="true"]{background:var(--ink);color:var(--desk)}
  .dock button[aria-pressed="true"] kbd{color:rgba(17,25,22,.45)}
  button:focus-visible,#tray:focus-visible{outline:2px solid var(--peach);outline-offset:2px}

  .stage{position:relative;flex:1;min-height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--edge);background:var(--mat)}
  #tray{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #tray:focus-visible{outline-offset:-3px}
  .toast{
    position:absolute;top:14px;left:50%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
    max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:rgba(12,20,17,.8);border:1px solid var(--edge);border-radius:999px;
    padding:7px 16px;font-size:13px;color:var(--ink);
    transition:opacity .35s,transform .35s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .tools{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    display:flex;gap:3px;padding:4px;border-radius:999px;max-width:calc(100% - 24px);
    background:rgba(12,20,17,.84);border:1px solid var(--edge);
  }
  .tools[hidden]{display:none}
  .tools button{
    font:inherit;font-size:13px;font-weight:500;color:var(--ink-dim);white-space:nowrap;
    background:transparent;border:0;border-radius:999px;padding:6px 13px;cursor:pointer;
    transition:background-color .2s,color .2s;
  }
  .tools button:hover{color:var(--ink)}
  .tools button[aria-pressed="true"]{background:var(--ink);color:var(--desk)}

  footer{display:flex;flex-direction:column;gap:6px}
  .readout{display:flex;align-items:center;justify-content:space-between;gap:8px 24px;flex-wrap:wrap}
  .stats{display:flex;gap:6px 22px;flex-wrap:wrap}
  .stat{display:flex;align-items:baseline;gap:7px;font-size:13px;color:var(--ink-dim)}
  .stat b{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-weight:500;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
  .meter{display:flex;align-items:center;gap:10px;font:12px "DM Mono",ui-monospace,Menlo,monospace;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase}
  .meter .bar{width:140px;height:4px;border-radius:4px;background:rgba(214,236,222,.12);overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--peach);border-radius:4px;transition:width .25s;box-shadow:0 0 10px var(--peach)}
  .meter output{min-width:4ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  .hint{margin:0;font-size:13px;color:var(--ink-dim);max-width:82ch}
  .hint #ear{color:var(--peach)}
  .hint kbd{font:11px "DM Mono",ui-monospace,Menlo,monospace;border:1px solid var(--edge);border-radius:4px;padding:0 4px;color:var(--ink)}

  @media (max-width:1100px){.brand p{display:none}}
  @media (max-width:640px){
    h1{font-size:22px}
    #viz{width:64px}
    .controls{width:100%}
    .toggle{padding:5px 9px;font-size:12.5px;gap:6px}
    .tools button{padding:6px 9px;font-size:12.5px}
    .dock kbd,.toggle .wide{display:none}
    .dock button{padding:7px 10px}
    .meter .bar{width:96px}
  }
  @media (prefers-reduced-motion:reduce){.toast,.meter i,.dock button,.toggle{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Quiet Hands</h1>
      <canvas id="viz" aria-hidden="true"></canvas>
      <p>Ten trays of soft, crunchy, whispery things.</p>
    </div>
    <div class="controls" role="group" aria-label="Sound and play">
      <button type="button" class="toggle" id="rain" aria-pressed="false">Rain</button>
      <button type="button" class="toggle" id="fire" aria-pressed="false">Fire</button>
      <button type="button" class="toggle" id="whisper" aria-pressed="false" title="Soft whispers drifting from ear to ear">Whispers</button>
      <button type="button" class="toggle" id="bin" aria-pressed="true" title="Binaural 3D sound, best on headphones">3D<span class="wide"> sound</span></button>
      <button type="button" class="toggle" id="auto" aria-pressed="false" title="A ghost hand plays the tray for you">Autoplay</button>
      <button type="button" class="toggle" id="sound" aria-pressed="true">Sound</button>
    </div>
  </header>

  <nav class="dock" aria-label="Trays">
    <button type="button" data-tray="wrap" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="4"/><circle cx="16.5" cy="7.5" r="3"/><circle cx="13" cy="16.5" r="4.5"/></svg>Bubbles<kbd>1</kbd></button>
    <button type="button" data-tray="sand" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="1"/><path d="M10 10v10M10 3v5"/></svg>Sand<kbd>2</kbd></button>
    <button type="button" data-tray="slime" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17c-2-3 0-8 4-9 3-1 4-4 7-3 4 1 5 6 3 9-2 4-6 4-9 4s-4 1-5-1z"/><circle cx="14" cy="10" r="1"/></svg>Slime<kbd>3</kbd></button>
    <button type="button" data-tray="foam" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="1.5"/><circle cx="9" cy="11" r="1.6"/><circle cx="15" cy="13.5" r="1.6"/></svg>Foam<kbd>4</kbd></button>
    <button type="button" data-tray="tap" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M7.5 7.5a6.5 6.5 0 0 0 0 9M16.5 7.5a6.5 6.5 0 0 1 0 9M4.5 4.5a10.5 10.5 0 0 0 0 15M19.5 4.5a10.5 10.5 0 0 1 0 15"/></svg>Tapping<kbd>5</kbd></button>
    <button type="button" data-tray="pond" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c3-4 9-5 13-1l5-3v8l-5-3c-4 4-10 3-13-1z"/><circle cx="7.5" cy="11.5" r=".6"/></svg>Koi pond<kbd>6</kbd></button>
    <button type="button" data-tray="zen" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7c3-2 6 2 9 0s6-2 9 0M3 12c3-2 6 2 9 0M3 17c3-2 5 2 7 0"/><circle cx="17.5" cy="16" r="3"/></svg>Zen garden<kbd>7</kbd></button>
    <button type="button" data-tray="keys" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="11" rx="2"/><path d="M6 10h.01M9 10h.01M12 10h.01M15 10h.01M18 10h.01M7.5 14h9"/></svg>Keyboard<kbd>8</kbd></button>
    <button type="button" data-tray="ice" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l6 7-3 3 4 6M10 11l6-2 4 4M16 9l1-5M7 14l-3 2"/></svg>Ice<kbd>9</kbd></button>
    <button type="button" data-tray="mic" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9a5 5 0 0 1 10 0c0 3-2 4-3 6s-1 5-4 5a3 3 0 0 1-3-2"/><path d="M11 10a2 2 0 0 1 4 0c0 1.5-1.5 2-2 3"/></svg>Ear mic<kbd>0</kbd></button>
  </nav>

  <main class="stage" id="stage">
    <canvas id="tray" tabindex="0" aria-label="Bubble wrap tray"></canvas>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="tools" id="tools" role="group" aria-label="Microphone tools" hidden>
      <button type="button" data-tool="brush" aria-pressed="true">Brush</button>
      <button type="button" data-tool="fingers" aria-pressed="false">Fingertips</button>
      <button type="button" data-tool="fluffy" aria-pressed="false">Fluffy cover</button>
      <button type="button" data-tool="whisper" aria-pressed="false">Whisper</button>
    </div>
  </main>

  <footer>
    <div class="readout">
      <div class="stats" id="stats"></div>
      <div class="meter"><span id="meterLabel">Sheet</span><span class="bar"><i id="meterFill"></i></span><output id="meterVal">0%</output></div>
    </div>
    <p class="hint"><span id="ear">Headphones on: the sound is binaural 3D and follows your hand. It starts on your first touch. </span><span id="hintText"></span> <span id="keysHint"><kbd>Space</kbd> plays one move, <kbd>1</kbd>–<kbd>0</kbd> switch trays, <kbd>A</kbd> autoplay, <kbd>W</kbd> whispers.</span></p>
  </footer>
</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('tray');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const $stats = document.getElementById('stats');
const $meterLabel = document.getElementById('meterLabel');
const $meterFill = document.getElementById('meterFill');
const $meterVal = document.getElementById('meterVal');
const $hint = document.getElementById('hintText');
const $ear = document.getElementById('ear');
const $toast = document.getElementById('toast');
const $rain = document.getElementById('rain');
const $sound = document.getElementById('sound');
const $fire = document.getElementById('fire');
const $bin = document.getElementById('bin');
const $auto = document.getElementById('auto');
const $viz = document.getElementById('viz');
const $keysHint = document.getElementById('keysHint');
const $whisper = document.getElementById('whisper');
const $tools = document.getElementById('tools');
const toolBtns = [...document.querySelectorAll('#tools button')];
const tabs = [...document.querySelectorAll('.dock button')];
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const TAU = Math.PI * 2;
const CM = 24;                       // one centimetre on the cutting mat, in CSS px
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const easeIn = t => t * t * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);

let W = 0, H = 0, DPR = 1, clock = 0;
const view = { s: 1, ox: 0, oy: 0 };
let current = null;
let pointerType = 'mouse';

function layer(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * DPR));
  c.height = Math.max(1, Math.ceil(h * DPR));
  const g = c.getContext('2d');
  g.scale(DPR, DPR);
  return [c, g];
}
function panOf(x) { return clamp(((x * view.s + view.ox) / (W || 1)) * 2 - 1, -1, 1); }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function roundRect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ---------- saved totals ---------- */
const STORE = 'quiet-hands:v1';
const stats = { popped: 0, sheets: 0, bestRun: 0, slices: 0, thinnest: 0, blocks: 0, pockets: 0, batches: 0, crunches: 0, bricks: 0, taps: 0, plucks: 0, drops: 0, nibbles: 0, koi: 2, gardens: 0, keys: 0, boards: 0, cracks: 0, zaps: 0, shattered: 0, earTaps: 0, whispers: 0, tingles: 0 };
try {
  const s = JSON.parse(localStorage.getItem(STORE) || '{}');
  for (const k in stats) if (Number.isFinite(s[k])) stats[k] = s[k];
} catch (e) {}
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(stats)); } catch (e) {} }, 500);
}
function remember(key, val) { try { localStorage.setItem('quiet-hands:' + key, val); } catch (e) {} }
function recall(key) { try { return localStorage.getItem('quiet-hands:' + key); } catch (e) { return null; } }

/* ---------- procedural recordings ---------- */
// Real ASMR is made of micro-detail: thousands of tiny clicks, crackles and short resonances,
// each one a little different, picked up very close to the microphone. Every sound here is
// rendered ahead of time into short "recordings" built that way, then played back with small
// random changes, so no two pops, taps or crunches are the same.
const SR = 48000;
const BANK = {};
const bankJobs = [];
const P = {};
const pick = a => a[(Math.random() * a.length) | 0];

function coef(type, f, q, g) {
  const w = (TAU * Math.min(f, SR * 0.45)) / SR, cs = Math.cos(w), sn = Math.sin(w), al = sn / (2 * q);
  let b0, b1, b2, a0, a1, a2;
  if (type === 'lp') { b0 = (1 - cs) / 2; b1 = 1 - cs; b2 = b0; a0 = 1 + al; a1 = -2 * cs; a2 = 1 - al; }
  else if (type === 'hp') { b0 = (1 + cs) / 2; b1 = -(1 + cs); b2 = b0; a0 = 1 + al; a1 = -2 * cs; a2 = 1 - al; }
  else if (type === 'bp') { b0 = al; b1 = 0; b2 = -al; a0 = 1 + al; a1 = -2 * cs; a2 = 1 - al; }
  else { const A = Math.pow(10, (g || 0) / 40); b0 = 1 + al * A; b1 = -2 * cs; b2 = 1 - al * A; a0 = 1 + al / A; a1 = -2 * cs; a2 = 1 - al / A; }
  return [b0 / a0, b1 / a0, b2 / a0, a1 / a0, a2 / a0];
}
function filt(x, type, f, q, g) {
  const [b0, b1, b2, a1, a2] = coef(type, f, q, g);
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < x.length; i++) { const v = x[i], y = b0 * v + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2; x2 = x1; x1 = v; y2 = y1; y1 = y; x[i] = y; }
  return x;
}
// a filter whose frequency moves over time (fAt gives the frequency at sample i)
function filtTV(x, type, fAt, q) {
  const B = 64;
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let s = 0; s < x.length; s += B) {
    const [b0, b1, b2, a1, a2] = coef(type, fAt(s), q), e = Math.min(x.length, s + B);
    for (let i = s; i < e; i++) { const v = x[i], y = b0 * v + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2; x2 = x1; x1 = v; y2 = y1; y1 = y; x[i] = y; }
  }
  return x;
}
function norm(x, peak) {
  let m = 0;
  for (let i = 0; i < x.length; i++) { const a = x[i] < 0 ? -x[i] : x[i]; if (a > m) m = a; }
  if (m > 0) { const k = peak / m; for (let i = 0; i < x.length; i++) x[i] *= k; }
  return x;
}
// bring a texture to a steady loudness, without letting its loudest crackle clip
function normRms(x, rms) {
  let s = 0, m = 0;
  for (let i = 0; i < x.length; i++) { s += x[i] * x[i]; const a = x[i] < 0 ? -x[i] : x[i]; if (a > m) m = a; }
  const r = Math.sqrt(s / x.length);
  if (r > 0) { const k = Math.min(rms / r, 0.92 / m); for (let i = 0; i < x.length; i++) x[i] *= k; }
  return x;
}
function white(n) { const x = new Float32Array(n); for (let i = 0; i < n; i++) x[i] = Math.random() * 2 - 1; return x; }
function burstNoise(ms, frac = 4) {
  const n = Math.max(4, Math.round((SR * ms) / 1000)), x = new Float32Array(n);
  for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.exp(-i / (n / frac));
  return x;
}
function add(dst, src, pos, amp) {
  const e = Math.min(src.length, dst.length - pos);
  for (let i = Math.max(0, -pos); i < e; i++) dst[pos + i] += src[i] * amp;
}
// one tiny event: a burst of noise a fraction of a millisecond long, coloured by a resonance
function tick(ms, f, q, hp) {
  const n = Math.max(4, Math.round((SR * ms) / 1000)), ringN = Math.round(Math.min(0.02, (q / (Math.PI * f)) * 5) * SR), x = new Float32Array(n + ringN);
  for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.exp(-i / Math.max(1, n / 3));
  filt(x, 'bp', f, q);
  if (hp) filt(x, 'hp', hp, 0.7);
  return norm(x, 1);
}
function pool(n, gen) { const a = []; for (let i = 0; i < n; i++) a.push(gen(i)); return a; }
function sprinkle(x, pl, pos, amp) { add(x, pick(pl), pos, Math.random() < 0.5 ? amp : -amp); }
// decaying resonances: [frequency, decay seconds, level, optional beat Hz for a shimmering pair]
function ring(x, pos, list, amp) {
  for (const [f, d, g, beat] of list) {
    const n = Math.min(x.length - pos, Math.round(d * SR * 7)), w = (TAU * f) / SR, wb = beat ? (TAU * (f + beat)) / SR : 0, k = Math.exp(-1 / (d * SR)), att = Math.round(SR * 0.0002);
    let e = amp * g;
    for (let i = 0; i < n; i++) {
      let v = Math.sin(w * i);
      if (beat) v = 0.6 * v + 0.4 * Math.sin(wb * i);
      x[pos + i] += e * v * (i < att ? i / att : 1);
      e *= k;
    }
  }
}
// a bubble closing up: a decaying tone that slides upward (the sound of every drip and plip)
function bubble(f0, rise, d) {
  const n = Math.round(SR * d * 7), x = new Float32Array(n), ka = Math.exp(-1 / (SR * d)), kq = Math.exp(-1 / (SR * d * 1.2)), w0 = (TAU * f0) / SR;
  let ph = 0, a = 1, q = 1;
  for (let i = 0; i < n; i++) {
    ph += w0 * (1 + (rise - 1) * (1 - q));
    x[i] = Math.sin(ph) * a * (i < 24 ? i / 24 : 1);
    a *= ka; q *= kq;
  }
  return x;
}
// clustered event times: each event briefly raises the chance of more, the way crackles come in bursts
function events(sec, base, jump, fade, cap) {
  const out = [];
  let t = 0, r = base;
  for (;;) {
    const dt = -Math.log(1 - Math.random()) / r;
    t += dt;
    if (t >= sec) break;
    r = base + (r - base) * Math.exp(-dt * fade);
    out.push(t);
    r = Math.min(cap, r + jump * Math.random());
  }
  return out;
}
// a smooth random wobble between 0 and 1
function wobble(n, hz) {
  const step = SR / hz, pts = new Float32Array(Math.ceil(n / step) + 3);
  for (let i = 0; i < pts.length; i++) pts[i] = Math.random();

/* ================= KINETIC SAND ================= */
const Sand = {
  name: 'sand', cursor: 'none',
  label: 'Kinetic sand tray. Click or tap the block to slice it, or drag the blade down. Press the crumbled pile to squish it.',
  hint: 'Click or tap the block to slice it where you point, or drag the blade down yourself. Thin slices tip over and crumble, wide ones slump. Press and drag on the crumbled pile to squish it.',
  LW: 0, LH: 0, G: 2,
  flavors: [
    { name: 'Lavender', bands: ['#b8a3e3'] },
    { name: 'Sunset layers', bands: ['#f2ae8c', '#f3d38c', '#e893ad'] },
    { name: 'Mint', bands: ['#96d6bb'] },
    { name: 'Tide layers', bands: ['#84bbe4', '#a2ddd5', '#c2b3ee', '#efc0d3'] },
    { name: 'Apricot', bands: ['#f0b394'] }

  fi: 0, phase: 'idle', phaseT: 0, slide: 0,

  build() {

    this.resetPile();

    this.knife = { x: b.x0 + 24, y: b.top - 22, show: true };
    this.slabs = []; this.grains = [];

  },
  newBlock() {

    this.paintBlock();
  },
  paintBlock() {

    const [c, g] = layer(b.w, b.h);
    this.tex = c; this.flavor = f;
    const n = f.bands.length;
    this.bands = [];
    for (let k = 0; k < n; k++) {
      const base = (b.h * k) / n;
      const A1 = rand(2, 6), A2 = rand(1, 3), F1 = rand(0.01, 0.025), F2 = rand(0.04, 0.07), P1 = rand(0, TAU), P2 = rand(0, TAU);

    const count = Math.floor((b.w * b.h) / 4.5);
    for (let i = 0; i < count; i++) {
      g.fillStyle = styles[(Math.random() * styles.length) | 0];
      const s = Math.random() < 0.8 ? 1 : 1.5;
      g.fillRect(Math.random() * b.w, Math.random() * b.h, s, s);
    }

  down(p) {

  up() {

  },
  leave() { if (!this.pressed) this.knife.show = false; },
  exit() { this.pressed = false; this.crushing = false; this.finger = null; if (this.cut) this.auto = true; Sound.silence(); },

  },
  abort() { this.scar = { x: this.cut.x, depth: this.cut.depth, life: 1.4 }; this.cut = null; },
  finish() {

      x0: b.x0, t, h: b.h, u0: b.x0 - b.left0, a: 0, time: 0, rest: 0, state: wide ? 'slump' : 'tip',
      T: 0.34 * Math.sqrt(b.h / 180), aImp: wide ? 0 : this.impactAngle(b.x0, b.h)

    stats.slices++;
    if (!stats.thinnest || mm < stats.thinnest) stats.thinnest = Math.round(mm * 10) / 10;
    addFx({ kind: 'text', x: x - t / 2, y: b.top - 12, vx: 0, vy: -18, text: mm.toFixed(1) + ' mm', life: 1.2 });
    Sound.grains(panOf(x), 4);
    save(); hud();
    if (b.x1 - b.x0 < 1) {
      this.phase = 'done'; this.phaseT = 0;
      stats.blocks++; save();
      Sound.chime(0, [0, 5, 9, 12]);
      celebrate(b.x1 - b.w / 2, b.top);
      toast(`${this.flavor.name} block sliced · ${this.blockSlices} slices`);
    }
  },
  impactAngle(x0, h) {
    // the slab tips over its bottom-left corner and stops where it meets the pile
    const G = this.G, c0 = Math.max(0, Math.floor((x0 - h) / G)), c1 = Math.max(0, Math.floor((x0 - h * 0.3) / G));
    let m = 0;
    for (let c = c0; c <= c1 && c < this.cols; c++) m = Math.max(m, this.pileH[c]);
    return -Math.acos(clamp((m * G) / h, 0, 0.97));
  },
  land(s) {
    const cx = s.state === 'slump' ? s.x0 + s.t / 2 : s.x0 - s.h * 0.5, spread = s.state === 'slump' ? s.t * 0.5 : s.h * 0.4;
    Sound.thud(panOf(cx), clamp((s.t * s.h) / 9000, 0.12, 1));
    for (let i = 0; i < 6; i++) addFx({ kind: 'dust', x: cx + rand(-spread, spread), y: this.floor - rand(0, 6), vx: rand(-30, 30), vy: rand(-25, -5), r: rand(3, 7), c: this.shade(2), life: rand(0.35, 0.6) });
  },
  crumble(s) {
    const G = this.G, cos = Math.cos(s.a), sin = Math.sin(s.a), slump = s.state === 'slump';
    let n = 0;
    for (let v = 0; v < s.h; v += G) for (let u = 0; u < s.t; u += G) {
      if (Math.random() > 0.5) continue;
      const lx = u + G / 2, ly = -(v + G / 2);
      const x = s.x0 + lx * cos - ly * sin, y = this.floor + lx * sin + ly * cos;
      const ci = this.grainColor(s.u0 + u, s.h - v - G / 2);
      n++;
      // a wide chunk sinks straight into a heap; only its top crumbles down over it
      if (slump && v < s.h * 0.72) { this.settle(Math.floor(x / G), ci); continue; }
      this.grains.push({ x, y, vx: rand(-18, 18) + (Math.random() < 0.15 ? rand(-60, 60) : 0), vy: rand(-35, 5), ci });
    }
    Sound.crumble(panOf(slump ? s.x0 + s.t / 2 : s.x0 - s.h * 0.5), clamp(n / 600, 0.15, 1));
  },
  wallCol() { const b = this.block; return b.x1 - b.x0 > 0 ? Math.floor(b.x0 / this.G) - 1 : this.cols - 1; },
  settle(c, ci) {
    const Hh = this.pileH, G = this.G, lim = Math.min(this.wallCol(), this.cols - 1);
    if (lim < 0) return;
    if (c > lim) c = lim;
    for (let k = 0; k < 40; k++) {
      const h = Hh[c];
      const l = c > 0 ? Hh[c - 1] : 0, r = c < lim ? Hh[c + 1] : 65535;
      const canL = l < h - 1, canR = r < h - 1;   // kinetic sand holds a steep slope before it slides
      if (canL && canR) c += l < r || (l === r && Math.random() < 0.5) ? -1 : 1;
      else if (canL) c--;
      else if (canR) c++;
      else break;
      if (c < 0) return;   // rolled off the edge of the mat
    }
    if ((Hh[c] + 1) * G > this.floor - 12 || Hh[c] >= this.rows) return;
    this.pileCol[c * this.rows + Hh[c]] = ci;
    Hh[c]++;
    this.pg.fillStyle = this.palette[ci];
    this.pg.fillRect(c * G, this.floor - Hh[c] * G, G, G);
  },
  redrawCol(c) {
    const G = this.G, g = this.pg, base = c * this.rows, h = this.pileH[c];
    g.clearRect(c * G, 0, G, this.floor + 1);
    for (let k = 0; k < h; k++) {
      g.fillStyle = this.palette[this.pileCol[base + k]];
      g.fillRect(c * G, this.floor - (k + 1) * G, G, G);
    }
  },
  onPile(p) {
    const G = this.G, c = Math.floor(p.x / G);
    let m = 0;
    for (let k = c - 7; k <= c + 7; k++) if (k >= 0 && k < this.cols) m = Math.max(m, this.pileH[k]);
    return m > 0 && p.y > this.floor - m * G - 28 && p.y < this.floor + 34;
  },
  crushAt(p, first) {
    // a fingertip pushes into the pile: sand above the pad squeezes out to both sides
    const G = this.G, Hh = this.pileH, rows = this.rows, r = 13, f = this.finger;
    const lim = Math.min(this.wallCol(), this.cols - 1);
    const c0 = Math.max(0, Math.floor((p.x - r) / G)), c1 = Math.min(lim, Math.floor((p.x + r) / G));
    let removed = 0;
    for (let c = c0; c <= c1; c++) {
      const dx = (c * G + G / 2 - p.x) / r;
      if (dx * dx >= 1) continue;
      const keep = Math.max(0, Math.floor((this.floor - (p.y + r * 0.6 * Math.sqrt(1 - dx * dx))) / G));
      if (Hh[c] <= keep) continue;
      for (let k = Hh[c] - 1; k >= keep; k--) {
        removed++;
        if (this.grains.length < 2500 && Math.random() < 0.6) {
          const side = c * G + G / 2 < p.x ? -1 : 1;
          this.grains.push({ x: c * G + G / 2, y: this.floor - (k + 0.5) * G, vx: side * rand(40, 170) + (f ? f.vx * 0.3 : 0), vy: rand(-170, -30), ci: this.pileCol[c * rows + k] });
        }
      }
      Hh[c] = keep;
      this.redrawCol(c);
    }
    this.crushPend += removed;
    if (first || (this.crushPend > 0 && clock - this.crushT > 0.045)) {
      Sound.crunch(panOf(p.x), clamp(this.crushPend / 30, first ? 0.35 : 0.12, 1));
      this.crushT = clock; this.crushPend = 0;
    }
  },
  stepGrains(dt) {
    const G = this.G, b = this.block, floor = this.floor, Hh = this.pileH, gs = this.grains;
    const walled = b.x1 - b.x0 > 0, wall = b.x0 - 0.5, damp = Math.pow(0.2, dt);
    for (let i = gs.length - 1; i >= 0; i--) {
      const g = gs[i];
      g.vy += 1400 * dt; g.vx *= damp;
      g.x += g.vx * dt; g.y += g.vy * dt;
      if (walled && g.x > wall && g.y > b.top) { g.x = wall - Math.random(); g.vx = -Math.abs(g.vx) * 0.3; }
      const c = Math.floor(g.x / G);
      let gone = c < 0 || c >= this.cols || g.y > this.LH + 20;
      if (!gone && g.y >= floor - Hh[c] * G - G * 0.5) { this.settle(c, g.ci); gone = true; }
      if (gone) { gs[i] = gs[gs.length - 1]; gs.pop(); }
    }
  },
  crumb() {
    const b = this.block;
    addFx({ kind: 'crumb', x: this.cut.x + rand(-3, 1), y: b.top + rand(-1, 2), vx: rand(-50, 30), vy: rand(-70, -20), g: 600, c: this.shade(), life: rand(0.3, 0.6) });
  },
  key() {
    const b = this.block;
    if (this.phase !== 'idle' || this.cut || b.x1 - b.x0 < 1) return null;
    let x = Math.min(b.x1, b.x0 + rand(6, 18));
    if (b.x1 - x < 8) x = b.x1;
    this.cut = { x, depth: 0, target: 0 }; this.prevDepth = 0; this.auto = true; this.kbd = true;
    this.knife.show = true;
    return { x, y: b.top };
  },
  autoGap() { return rand(1.1, 1.7); },

  update(dt) {
    const b = this.block;
    if (this.cut) {
      const goal = this.auto ? b.h : this.cut.target, rate = this.auto ? 420 : 1000;
      if (this.cut.depth < goal) this.cut.depth = Math.min(goal, this.cut.depth + rate * dt);
      const dd = this.cut.depth - this.prevDepth;
      this.prevDepth = this.cut.depth;
      this.vel += (dd / Math.max(dt, 1e-3) - this.vel) * Math.min(1, dt * 20);
      if (dd > 0 && Math.random() < dd * 0.25) this.crumb();
      if (this.cut.depth >= b.h - 0.5) this.finish();
    } else this.vel *= Math.pow(0.0005, dt);
    Sound.sandCut(panOf(this.cut ? this.cut.x : this.knife.x), this.vel);

    if (this.scar) { this.scar.life -= dt; if (this.scar.life <= 0) this.scar = null; }

    for (let i = this.slabs.length - 1; i >= 0; i--) {
      const s = this.slabs[i];
      if (s.state === 'tip') {
        s.time += dt;
        const p = s.time / s.T;
        s.a = -Math.PI / 2 * p * p;
        if (s.a <= s.aImp) { s.a = s.aImp; s.state = 'rest'; this.land(s); }
      } else if (s.state === 'slump') {
        s.time += dt;
        s.a = -0.05 * Math.sin(s.time * 38) * Math.max(0, 1 - s.time / 0.22);
        if (s.time > 0.22) { s.a = 0; this.land(s); this.crumble(s); this.slabs.splice(i, 1); }
      } else {
        s.rest += dt;
        if (s.rest > 0.16) { this.crumble(s); this.slabs.splice(i, 1); }
      }
    }
    this.stepGrains(dt);

    if (this.phase === 'done') {
      this.phaseT += dt;
      if ((this.phaseT > 1.1 && !this.slabs.length && !this.grains.length) || this.phaseT > 4) {
        this.phase = 'sweep'; this.phaseT = 0; this.crushing = false; this.finger = null; Sound.sweep();
      }
    } else if (this.phase === 'sweep') {
      this.phaseT += dt / (reduceMotion ? 0.3 : 0.7);
      this.pileAlpha = 1 - Math.min(1, this.phaseT);
      if (this.phaseT >= 1) {
        this.fi++; this.newBlock(); this.resetPile(); this.grains.length = 0;
        this.phase = 'in'; this.phaseT = 0; this.slide = this.LW - this.block.x0 + 40;
        hud();
      }
    } else if (this.phase === 'in') {
      this.phaseT += dt / (reduceMotion ? 0.3 : 0.9);
      this.slide = (1 - easeOut(Math.min(1, this.phaseT))) * (this.LW - this.block.x0 + 40);
      if (this.phaseT >= 1) { this.phase = 'idle'; this.slide = 0; }
    }
  },

  drawBlock(sl, inner) {
    const b = this.block, w = b.x1 - b.x0, X = b.x0 + sl;
    if (w <= 0.5) return;
    if (!inner) {
      const sg = ctx.createLinearGradient(0, this.floor, 0, this.floor + 12);
      sg.addColorStop(0, 'rgba(3,14,10,.42)'); sg.addColorStop(1, 'rgba(3,14,10,0)');
      ctx.fillStyle = sg; ctx.fillRect(X - 3, this.floor, w + 10, 12);
    }
    const sx = (b.x0 - b.left0) * DPR, sw = Math.min(w * DPR, this.tex.width - sx);
    if (sw > 0) ctx.drawImage(this.tex, sx, 0, sw, this.tex.height, X, b.top, sw / DPR, b.h);
    if (b.x0 > b.left0 + 0.5) {
      const cg = ctx.createLinearGradient(X, 0, X + 7, 0);
      cg.addColorStop(0, 'rgba(34,14,44,.2)'); cg.addColorStop(1, 'rgba(34,14,44,0)');
      ctx.fillStyle = cg; ctx.fillRect(X, b.top, Math.min(7, w), b.h);
    }
  },
  drawSlab(s) {
    ctx.save();
    ctx.translate(s.x0, this.floor); ctx.rotate(s.a);
    const sx = s.u0 * DPR, sw = Math.max(1, Math.min(s.t * DPR, this.tex.width - sx));
    ctx.drawImage(this.tex, sx, 0, sw, this.tex.height, 0, -s.h, s.t, s.h);
    ctx.fillStyle = 'rgba(34,14,44,.14)'; ctx.fillRect(s.t - 1.5, -s.h, 1.5, s.h);
    ctx.restore();
  },
  cutLine(x, depth, a) {
    const b = this.block;
    ctx.strokeStyle = `rgba(28,12,36,${a.toFixed(3)})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x + 0.5, b.top); ctx.lineTo(x + 0.5, b.top + depth); ctx.stroke();
  },
  drawKnife() {
    const k = this.knife;
    if (!k.show && !this.cut) return;
    const b = this.block;
    let x = k.x, y = k.y;
    if (this.cut) { x = this.cut.x; y = b.top + this.cut.depth; }
    const L = b.h + 34, bw = 10, HL = 58;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(3,14,10,.2)';
    ctx.fillRect(7, -L - HL, bw, L + HL - 10);
    const gr = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
    gr.addColorStop(0, '#eef3f5'); gr.addColorStop(0.45, '#bcc6cd'); gr.addColorStop(0.55, '#86929a'); gr.addColorStop(1, '#dfe6ea');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.moveTo(-bw / 2, -L); ctx.lineTo(bw / 2, -L); ctx.lineTo(bw / 2, -bw * 0.7);
    ctx.quadraticCurveTo(bw / 2, 0, 0, 0);
    ctx.quadraticCurveTo(-bw / 2, 0, -bw / 2, -bw * 0.7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(10,20,24,.35)'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.fillStyle = '#c9d1d6'; roundRect(ctx, -bw / 2 - 2, -L - 7, bw + 4, 8, 2); ctx.fill();
    const hg = ctx.createLinearGradient(-8, 0, 8, 0);
    hg.addColorStop(0, '#4a3a31'); hg.addColorStop(0.4, '#6b5446'); hg.addColorStop(1, '#33271f');
    ctx.fillStyle = hg; roundRect(ctx, -8, -L - 7 - HL, 16, HL, 6); ctx.fill();
    ctx.fillStyle = 'rgba(230,220,210,.6)';
    for (const f of [0.3, 0.7]) { ctx.beginPath(); ctx.arc(0, -L - 7 - HL * f, 1.6, 0, TAU); ctx.fill(); }
    ctx.restore();
    if (this.cut && this.cut.depth > 0) {
      // the part of the blade inside the sand shows only faintly through it
      ctx.save();
      ctx.beginPath(); ctx.rect(x - bw, b.top, bw * 2, this.cut.depth); ctx.clip();
      ctx.globalAlpha = 0.78;
      this.drawBlock(0, true);
      ctx.restore();
      this.cutLine(this.cut.x, this.cut.depth, 0.45);
    }
  },
  drawFinger() {
    const f = this.finger;
    ctx.fillStyle = 'rgba(3,14,10,.2)';
    ctx.beginPath(); ctx.arc(f.x + 3, f.y + 4, 13, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(244,222,205,.3)';
    ctx.beginPath(); ctx.arc(f.x, f.y, 13, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,240,228,.55)'; ctx.lineWidth = 1; ctx.stroke();
  },
  draw() {
    const b = this.block;
    if (this.pileAlpha > 0) {
      ctx.globalAlpha = this.pileAlpha;
      ctx.drawImage(this.pile, 0, 0, this.LW, this.LH);
      ctx.globalAlpha = 1;
    }
    this.drawBlock(this.slide, false);
    if (this.scar && this.scar.x > b.x0) this.cutLine(this.scar.x, this.scar.depth, 0.4 * Math.min(1, this.scar.life));
    if (this.cut) this.cutLine(this.cut.x, this.cut.depth, 0.45);
    for (const s of this.slabs) this.drawSlab(s);
    const G = this.G, pal = this.palette;
    for (const g of this.grains) { ctx.fillStyle = pal[g.ci]; ctx.fillRect(g.x - G / 2, g.y - G / 2, G, G); }
    if (this.crushing && this.finger) this.drawFinger();
    else this.drawKnife();
  },
  statItems() {
    return [[stats.slices, 'slices'], [stats.thinnest ? stats.thinnest.toFixed(1) + ' mm' : '–', 'thinnest slice'], [stats.blocks, 'blocks']];
  },
  progress() { const b = this.block; return ['Block', b ? 1 - (b.x1 - b.x0) / b.w : 0]; }
};

/* ================= SLIME ================= */
const Slime = {
  name: 'slime', cursor: 'grab',
  label: 'Slime tray. Press and drag to knead, press on air pockets to pop them.',
  hint: 'Press and drag to knead. Kneading traps little air pockets; press on them to pop them. Knead it to full gloss for the next batch.',
  LW: 0, LH: 0,
  flavors: [
    { name: 'Lilac cloud', c: [196, 170, 238], glitter: false },
    { name: 'Sky glass', c: [138, 194, 238], glitter: true },
    { name: 'Mint frost', c: [142, 220, 188], glitter: false },
    { name: 'Peach cream', c: [245, 182, 156], glitter: true },
    { name: 'Butter', c: [240, 212, 136], glitter: false }
  ],
  fi: 0, gloss: 0, glossShown: 0, col: null, autoT: 0, acc: 0, energy: 0,

  build() {
    const LW = this.LW, LH = this.LH;
    const rw = Math.min(LW - 32, 720), rh = Math.min(LH - 32, 470);
    this.rx = (LW - rw) / 2; this.ry = (LH - rh) / 2; this.rw = rw; this.rh = rh;
    const cell = this.cell = Math.max(3, Math.sqrt((rw * rh) / 22000));
    const gw = this.gw = Math.ceil(rw / cell) + 1, gh = this.gh = Math.ceil(rh / cell) + 1, N = gw * gh;
    this.h = new Float32Array(N); this.v = new Float32Array(N); this.lap = new Float32Array(N);
    this.base = new Float32Array(N); this.mask = new Float32Array(N);
    // the outline wobbles outward by up to 5%, so the blob is laid out 6% inside its box
    const cx = rw / 2, cy = rh / 2, rad = Math.min(rw, rh) * 0.32;
    const hx = (rw / 2 - 6) / 1.06 - rad, hy = (rh / 2 - 6) / 1.06 - rad;
    const p1 = rand(0, TAU), p2 = rand(0, TAU), EDGE = Math.min(52, Math.min(rw, rh) * 0.16), THICK = 34;
    for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
      const px = i * cell - cx, py = j * cell - cy, a = Math.atan2(py, px);
      const wob = 1 + 0.03 * Math.sin(a * 3 + p1) + 0.02 * Math.sin(a * 5 + p2);
      const qx = Math.abs(px) / wob - hx, qy = Math.abs(py) / wob - hy;
      const inside = -(Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - rad);
      const k = j * gw + i, e = clamp(inside / EDGE, 0, 1);
      this.base[k] = THICK * (1 - (1 - e) * (1 - e));
      this.mask[k] = clamp(inside / (cell * 1.3) + 0.5, 0, 1);
    }
    this.off = document.createElement('canvas');
    this.off.width = gw; this.off.height = gh;
    this.og = this.off.getContext('2d');
    this.img = this.og.createImageData(gw, gh);

    // soft contact shadow, drawn once
    const [sc, sg] = layer(rw + 80, rh + 80);
    sg.shadowColor = 'rgba(2,12,9,.6)'; sg.shadowBlur = 24 * DPR;
    sg.shadowOffsetX = 10000 * DPR; sg.shadowOffsetY = 12 * DPR;
    roundRect(sg, 48 - 10000, 44, rw - 16, rh - 8, rad);
    sg.fillStyle = '#000'; sg.fill();
    this.shadow = sc;

    this.glit = [];
    for (let n = 0; n < 340; n++) {
      const k = (Math.random() * N) | 0;
      if (this.mask[k] > 0.99 && this.base[k] > THICK * 0.6) this.glit.push({ k, tx: rand(-0.7, 0.7), ty: rand(-0.7, 0.7) });
    }
    this.pockets = [];
    this.ptr = { x: LW / 2, y: LH / 2, down: false, on: false, speed: 0, acc: 0, dx: 1, dy: 0 };
    this.press = 0; this.autoT = 0; this.acc = 0;
    if (!this.col) this.col = this.flavors[this.fi % this.flavors.length].c.slice();
    this.awake = 0.5;
    this.light();
  },
  maskAt(x, y) {
    const i = Math.round((x - this.rx) / this.cell), j = Math.round((y - this.ry) / this.cell);
    if (i < 0 || j < 0 || i >= this.gw || j >= this.gh) return 0;
    return this.mask[j * this.gw + i];
  },
  radius() { return pointerType === 'touch' ? 34 : 28; },

  down(p) {
    const q = this.ptr;
    q.down = true; q.x = p.x; q.y = p.y; q.acc = 0;
    q.on = this.maskAt(p.x, p.y) > 0.5;
    canvas.style.cursor = 'grabbing';
    if (q.on) { Sound.squish(panOf(p.x)); this.awake = 1; }
  },
  move(p, pressed) {
    const q = this.ptr;
    if (pressed && q.down) {
      const dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy);
      if (d > 0.01) { q.dx = q.dx * 0.6 + (dx / d) * 0.4; q.dy = q.dy * 0.6 + (dy / d) * 0.4; }
      const was = q.on;
      q.on = this.maskAt(p.x, p.y) > 0.5;
      if (q.on && !was) Sound.squish(panOf(p.x));
      if (q.on) {
        q.acc += d;
        this.gloss = Math.min(1, this.gloss + d / (this.rw * 8));
        if (this.pockets.length < 40 && Math.random() < d * 0.018) this.spawnPocket(q);
        if (d > 0.5) hud();
      }
    }
    q.x = p.x; q.y = p.y;
  },
  up() {
    const q = this.ptr;
    if (q.down && q.on) Sound.suction(panOf(q.x));
    q.down = false; q.on = false;
    canvas.style.cursor = 'grab';
  },
  exit() { this.ptr.down = false; this.ptr.on = false; this.autoT = 0; Sound.silence(); },
  spawnPocket(q) {
    const R = this.radius(), a = Math.atan2(-q.dy, -q.dx) + rand(-1.2, 1.2), dist = R * rand(1.25, 1.9);
    const x = q.x + Math.cos(a) * dist, y = q.y + Math.sin(a) * dist;
    if (this.maskAt(x, y) > 0.95) this.pockets.push({ x, y, r: rand(2.5, 6.5), t: 0 });
  },
  popPockets() {
    const q = this.ptr, R = this.radius() * 0.8;
    for (let i = this.pockets.length - 1; i >= 0; i--) {
      const p = this.pockets[i];
      if (p.t < 0.25) continue;
      if ((p.x - q.x) * (p.x - q.x) + (p.y - q.y) * (p.y - q.y) < R * R) {
        this.pockets.splice(i, 1);
        Sound.click(panOf(p.x), rand(0.9, 1.2));
        addFx({ kind: 'ring', x: p.x, y: p.y, r0: p.r, r1: p.r * 2.6, life: 0.22 });
        stats.pockets++;
        this.gloss = Math.min(1, this.gloss + 0.006);
        save(); hud();
      }
    }
  },
  key() {
    if (this.autoT > 0) return null;
    let x = this.rx + this.rw / 2, y = this.ry + this.rh / 2;
    for (let n = 0; n < 20; n++) {
      const tx = this.rx + rand(0.25, 0.75) * this.rw, ty = this.ry + rand(0.25, 0.75) * this.rh;
      if (this.maskAt(tx, ty) > 0.9) { x = tx; y = ty; break; }
    }
    this.auto = { x, y, a: rand(0, TAU) };
    this.autoT = 0.7;
    this.down({ x, y });
    return { x, y };
  },
  autoGap() { return rand(0.85, 1.4); },
  complete() {
    stats.batches++; save();
    const done = this.flavors[this.fi % this.flavors.length];
    this.fi++;
    const next = this.flavors[this.fi % this.flavors.length];
    this.gloss = 0;
    this.pockets.length = 0;
    this.awake = 2.5;
    Sound.chime(0, [0, 4, 7, 11]);
    celebrate(this.rx + this.rw / 2, this.ry + this.rh / 2);
    toast(`${done.name} is glossy · next batch: ${next.name}`);
    hud();
  },

  pressField(x, y, dx, dy) {
    const { gw, gh, cell, h, v, mask } = this;
    const gx = (x - this.rx) / cell, gy = (y - this.ry) / cell;
    const R = this.radius() / cell, R2 = R * 2.2, depth = -24 * this.press;
    const i0 = Math.max(1, Math.floor(gx - R2)), i1 = Math.min(gw - 2, Math.ceil(gx + R2));
    const j0 = Math.max(1, Math.floor(gy - R2)), j1 = Math.min(gh - 2, Math.ceil(gy + R2));
    const ringW = (ex, ey, d) => Math.sin((Math.PI * (d - 1)) / 1.2) * (1 + 0.9 * Math.max(-0.8, (ex * dx + ey * dy) / (d * R)));
    let removed = 0, wsum = 0;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const k = j * gw + i;
      if (mask[k] < 0.5) continue;
      const ex = i - gx, ey = j - gy, d = Math.sqrt(ex * ex + ey * ey) / R;
      if (d < 1) {
        const f = 1 - d * d, target = depth * f * f;
        if (h[k] > target) { const dv = (target - h[k]) * 0.3; h[k] += dv; v[k] *= 0.6; removed -= dv; }
      } else if (d < 2.2) wsum += ringW(ex, ey, d);
    }
    if (removed <= 0 || wsum <= 0) return;
    // the slime pushed out from under the finger piles up around it, more so ahead of the motion
    const amt = (removed * 0.94) / wsum;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const k = j * gw + i;
      if (mask[k] < 0.5) continue;
      const ex = i - gx, ey = j - gy, d = Math.sqrt(ex * ex + ey * ey) / R;
      if (d >= 1 && d < 2.2) h[k] += amt * ringW(ex, ey, d);
    }
  },
  step() {
    const { gw, gh, h, v, mask } = this, L = this.lap;
    let mv = 0;
    for (let j = 1; j < gh - 1; j++) {
      let k = j * gw + 1;
      for (let i = 1; i < gw - 1; i++, k++) {
        if (mask[k] <= 0) continue;
        const lap = (h[k - 1] + h[k + 1] + h[k - gw] + h[k + gw]) * 0.25 - h[k];
        const nv = v[k] * 0.88 + lap * 0.2 - h[k] * 0.003;
        v[k] = nv; L[k] = lap;
        const a = nv < 0 ? -nv : nv;
        if (a > mv) mv = a;
      }
    }
    // a little viscosity smooths out grid-sized ripples
    for (let k = 0; k < h.length; k++) if (mask[k] > 0) h[k] += v[k] + L[k] * 0.12;
    this.energy = mv;
  },
  light() {
    const { gw, gh, h, base, mask } = this, d = this.img.data, inv = 1 / (2 * this.cell);
    const cr = this.col[0], cg = this.col[1], cb = this.col[2];
    const gl = this.glossShown, shin = 14 + gl * 80, sA = 0.35 + gl * 0.65;
    const Lx = -0.45, Ly = -0.6, Lz = 0.66;
    let Hx = Lx, Hy = Ly, Hz = Lz + 1;
    const hl = Math.hypot(Hx, Hy, Hz); Hx /= hl; Hy /= hl; Hz /= hl;
    for (let j = 0; j < gh; j++) {
      for (let i = 0; i < gw; i++) {
        const k = j * gw + i, p = k * 4, m = mask[k];
        if (m <= 0) { d[p + 3] = 0; continue; }
        const kl = i > 0 ? k - 1 : k, kr = i < gw - 1 ? k + 1 : k, ku = j > 0 ? k - gw : k, kd = j < gh - 1 ? k + gw : k;
        let nx = (base[kl] + h[kl] - base[kr] - h[kr]) * inv, ny = (base[ku] + h[ku] - base[kd] - h[kd]) * inv;
        const il = 1 / Math.sqrt(nx * nx + ny * ny + 1);
        nx *= il; ny *= il; const nz = il;
        const dif = Math.max(0, nx * Lx + ny * Ly + nz * Lz);
        const nh = Math.max(0, nx * Hx + ny * Hy + nz * Hz);
        const spec = Math.pow(nh, shin) * sA + nh * nh * nh * nh * 0.06;
        const fill = Math.max(0, nx * 0.5 + ny * 0.35 + nz * 0.4) * 0.14;
        const dent = h[k] < 0 ? Math.min(1, -h[k] / 26) * 0.14 : 0;
        const sh = 0.46 + 0.62 * dif + fill - dent, s = 255 * spec;
        d[p] = cr * sh + s; d[p + 1] = cg * sh + s; d[p + 2] = cb * sh + s + fill * 30; d[p + 3] = m * 255;
      }
    }
    if (this.flavors[this.fi % this.flavors.length].glitter) {
      for (const g of this.glit) {
        const k = g.k, i = k % gw;
        if (i < 1 || i > gw - 2 || k < gw || k >= h.length - gw) continue;
        let nx = (base[k - 1] + h[k - 1] - base[k + 1] - h[k + 1]) * inv + g.tx;
        let ny = (base[k - gw] + h[k - gw] - base[k + gw] - h[k + gw]) * inv + g.ty;
        const il = 1 / Math.sqrt(nx * nx + ny * ny + 1);
        const s = Math.pow(Math.max(0, (nx * Hx + ny * Hy + Hz) * il), 90) * 330;
        const p = k * 4;
        d[p] += s; d[p + 1] += s; d[p + 2] += s;
      }
    }
    this.og.putImageData(this.img, 0, 0);
  },

  update(dt) {
    const q = this.ptr, target = this.flavors[this.fi % this.flavors.length].c;
    let changing = false;
    for (let c = 0; c < 3; c++) {
      const d = target[c] - this.col[c];
      if (Math.abs(d) > 0.5) { this.col[c] += d * Math.min(1, dt * 2.2); changing = true; } else this.col[c] = target[c];
    }
    const gd = this.gloss - this.glossShown;
    if (Math.abs(gd) > 0.002) { this.glossShown += gd * Math.min(1, dt * 3); changing = true; }

    if (this.autoT > 0) {
      this.autoT -= dt;
      const A = this.auto;
      A.a += dt * 7;
      this.move({ x: A.x + Math.cos(A.a) * 22, y: A.y + Math.sin(A.a) * 14 }, true);
      if (this.autoT <= 0) this.up();
    }

    this.press = q.down && q.on ? Math.min(1, this.press + dt * 7) : Math.max(0, this.press - dt * 6);
    const inst = q.acc / Math.max(dt, 1e-3);
    q.acc = 0;
    q.speed += (inst - q.speed) * Math.min(1, dt * 10);
    if (this.press > 0) { this.pressField(q.x, q.y, q.dx, q.dy); this.awake = 1; if (q.down) this.popPockets(); }

    if (this.awake > 0 || changing) {
      this.acc += dt;
      let n = 0;
      while (this.acc >= 1 / 60 && n < 3) { this.step(); this.acc -= 1 / 60; n++; }
      if (n === 3) this.acc = 0;
      this.light();
      if (this.press <= 0 && this.energy < 0.002) this.awake -= dt;
    }

    const pan = panOf(q.x);
    if (q.down && q.on) {
      Sound.slimeMove(pan, q.speed, this.press);
      if (Math.random() < dt * Math.min(14, q.speed / 140)) Sound.click(pan, rand(0.2, 0.6));
    } else Sound.slimeMove(pan, 0, 0);

    for (const p of this.pockets) p.t += dt;
    if (this.gloss >= 1) this.complete();
  },
  draw() {
    ctx.drawImage(this.shadow, this.rx - 40, this.ry - 40, this.rw + 80, this.rh + 80);
    ctx.imageSmoothingEnabled = true;
    if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
    const c = this.cell;
    ctx.drawImage(this.off, this.rx - c / 2, this.ry - c / 2, this.gw * c, this.gh * c);
    for (const p of this.pockets) {
      const a = Math.min(1, p.t / 0.25), r = p.r * (0.4 + 0.6 * a);
      ctx.globalAlpha = 0.9 * a;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 0.9; ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x - r * 0.35, p.y - r * 0.35, r * 0.3, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
    }
    ctx.globalAlpha = 1;
  },
  statItems() {
    return [[stats.pockets, 'air pockets popped'], [stats.batches, 'batches kneaded'], [this.flavors[this.fi % this.flavors.length].name, 'in the tray']];
  },
  progress() { return ['Gloss', this.gloss]; }
};

/* ================= FLORAL FOAM ================= */
const Foam = {
  name: 'foam', cursor: 'pointer',
  label: 'Floral foam tray. Press into the foam to crunch it, drag to carve a line.',
  hint: 'Press into the foam to crunch a hole, or drag to carve a line through it. Fresh foam crunches loudest. Crush the whole brick for a new one.',
  LW: 0, LH: 0,
  flavors: [
    { name: 'Wet foam', base: [127, 174, 79], pore: '24,52,12', rim: '220,244,180' },
    { name: 'Dry foam', base: [183, 162, 130], pore: '60,44,24', rim: '252,238,214' },
    { name: 'Rose foam', base: [227, 162, 184], pore: '92,36,56', rim: '255,232,240' }
  ],
  fi: 0, phase: 'idle', phaseT: 0, slide: 0, GOAL: 0.85,

  fl() { return this.flavors[this.fi % this.flavors.length]; },
  build() {
    const bw = Math.round(Math.min(this.LW - 56, 600)), bh = Math.round(Math.min(this.LH - 76, 360));
    this.brick = { x: Math.round((this.LW - bw) / 2), y: Math.round((this.LH - bh) / 2 - 7), w: bw, h: bh, side: 14 };
    this.R = clamp(Math.min(bw, bh) * 0.055, 12, 20);
    this.cs = 12;
    this.cw = Math.ceil(bw / this.cs); this.ch = Math.ceil(bh / this.cs);
    this.cells = new Uint8Array(this.cw * this.ch); this.hitN = 0;
    this.bits = []; this.pressed = false; this.last = null;
    this.soundAt = 0; this.pend = 0; this.pendFresh = 0; this.pendX = 0;
    this.paint();
    if (this.phase !== 'in') { this.phase = 'idle'; this.slide = 0; }
  },
  paint() {
    const b = this.brick, f = this.fl(), [c, g] = layer(b.w, b.h);
    this.tex = c; this.tg = g;
    const [r, gg, bb] = f.base;
    g.fillStyle = `rgb(${r},${gg},${bb})`; g.fillRect(0, 0, b.w, b.h);
    // open-cell pores
    const pores = [`rgba(${f.pore},.16)`, `rgba(${f.pore},.24)`, `rgba(${f.pore},.34)`, `rgba(${f.rim},.12)`, `rgba(${f.rim},.2)`];
    const n = Math.floor((b.w * b.h) / 7);
    for (let i = 0; i < n; i++) {
      g.fillStyle = pores[(Math.random() * pores.length) | 0];
      const s = Math.random() < 0.75 ? 1 : 1.6;
      g.fillRect(Math.random() * b.w, Math.random() * b.h, s, s);
    }
    const lg = g.createLinearGradient(0, 0, b.w, b.h);
    lg.addColorStop(0, 'rgba(255,255,255,.1)'); lg.addColorStop(1, 'rgba(0,0,0,.1)');
    g.fillStyle = lg; g.fillRect(0, 0, b.w, b.h);
    g.fillStyle = `rgba(${f.rim},.35)`; g.fillRect(0, 0, b.w, 1.5); g.fillRect(0, 0, 1.5, b.h);
    g.fillStyle = `rgba(${f.pore},.35)`; g.fillRect(0, b.h - 1.5, b.w, 1.5); g.fillRect(b.w - 1.5, 0, 1.5, b.h);
    const m = (v, k) => Math.min(255, v * k) | 0;
    this.sideCol = `rgb(${m(r, 0.62)},${m(gg, 0.62)},${m(bb, 0.62)})`;
    this.bitCols = [`rgb(${r},${gg},${bb})`, `rgb(${m(r, 0.84)},${m(gg, 0.84)},${m(bb, 0.84)})`, `rgb(${m(r, 1.12)},${m(gg, 1.12)},${m(bb, 1.12)})`];
  },
  stamp(x, y, r, depth = 1) {
    // presses a crater into the foam; returns how much of it was untouched foam (0..1), or -1 if off the brick
    const b = this.brick, lx = x - b.x - this.slide, ly = y - b.y;
    if (lx < -r * 0.3 || ly < -r * 0.3 || lx > b.w + r * 0.3 || ly > b.h + r * 0.3) return -1;
    const cs = this.cs;
    let tot = 0, fresh = 0;
    const i0 = Math.max(0, Math.floor((lx - r) / cs)), i1 = Math.min(this.cw - 1, Math.floor((lx + r) / cs));
    const j0 = Math.max(0, Math.floor((ly - r) / cs)), j1 = Math.min(this.ch - 1, Math.floor((ly + r) / cs));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const cx = (i + 0.5) * cs - lx, cy = (j + 0.5) * cs - ly;
      if (cx * cx + cy * cy > r * r) continue;
      tot++;
      const k = j * this.cw + i;
      if (!this.cells[k]) { this.cells[k] = 1; fresh++; this.hitN++; }
    }
    const fr = tot ? fresh / tot : 0, f = this.fl(), g = this.tg, k = (0.45 + 0.55 * fr) * depth;
    const gr = g.createRadialGradient(lx - r * 0.2, ly - r * 0.25, r * 0.05, lx, ly, r);
    gr.addColorStop(0, `rgba(${f.pore},${(0.5 * k).toFixed(3)})`);
    gr.addColorStop(0.65, `rgba(${f.pore},${(0.32 * k).toFixed(3)})`);
    gr.addColorStop(1, `rgba(${f.pore},0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(lx, ly, r, 0, TAU); g.fill();
    // light from the top left catches the far inside wall of the hole
    g.strokeStyle = `rgba(${f.rim},${(0.22 * k).toFixed(3)})`; g.lineWidth = r * 0.16;
    g.beginPath(); g.arc(lx, ly, r * 0.74, 0.15 * Math.PI, 0.75 * Math.PI); g.stroke();
    for (let i = 0; i < 10; i++) {
      const a = rand(0, TAU), rr = r * rand(0.8, 1.25);
      g.fillStyle = Math.random() < 0.5 ? `rgba(${f.pore},.35)` : `rgba(${f.rim},.35)`;
      g.fillRect(lx + Math.cos(a) * rr, ly + Math.sin(a) * rr, rand(1, 2.2), rand(1, 2.2));
    }
    return fr;
  },
  crunch(p, fr, amt, bits) {
    if (fr > 0) stats.crunches++;
    this.pend = Math.max(this.pend, amt); this.pendFresh = Math.max(this.pendFresh, fr); this.pendX = p.x;
    if (amt >= 1 || clock - this.soundAt > 0.035) this.flush();
    for (let i = 0; i < bits; i++) {
      const a = rand(0, TAU), v = rand(60, 170);
      this.bits.push({ x: p.x + Math.cos(a) * this.R * 0.7, y: p.y + Math.sin(a) * this.R * 0.7, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: rand(0.25, 0.5), c: this.bitCols[(Math.random() * 3) | 0], s: rand(1.5, 3) });
    }
    if (amt >= 1 && pointerType === 'touch' && navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
    save(); hud();
    if (this.phase === 'idle' && this.hitN / this.cells.length >= this.GOAL) this.complete();
  },
  flush() {
    Sound.foam(panOf(this.pendX), this.pend, this.pendFresh);
    this.soundAt = clock; this.pend = 0; this.pendFresh = 0;
  },
  down(p) {
    if (this.phase !== 'idle') return;
    const fr = this.stamp(p.x, p.y, this.R * 1.05);
    if (fr < 0) return;
    this.pressed = true; this.last = p;
    this.crunch(p, fr, 1, 7);
  },
  move(p, pressed) {
    if (!pressed || !this.pressed || this.phase !== 'idle') return;
    const dx = p.x - this.last.x, dy = p.y - this.last.y, dist = Math.hypot(dx, dy), step = this.R * 0.5;
    if (dist < step) return;
    const n = Math.floor(dist / step);
    for (let i = 1; i <= n && this.phase === 'idle'; i++) {
      const q = { x: this.last.x + (dx * i * step) / dist, y: this.last.y + (dy * i * step) / dist };
      const fr = this.stamp(q.x, q.y, this.R * 0.85, 0.55);
      if (fr >= 0) this.crunch(q, fr, 0.5, fr > 0.2 ? 2 : 0);
    }
    this.last = { x: this.last.x + (dx * n * step) / dist, y: this.last.y + (dy * n * step) / dist };
  },
  up() { this.pressed = false; },
  exit() { this.pressed = false; },
  key() {
    if (this.phase !== 'idle') return;
    const b = this.brick;
    for (let n = 0; n < 60; n++) {
      const k = (Math.random() * this.cells.length) | 0;
      if (this.cells[k]) continue;
      const p = { x: b.x + ((k % this.cw) + 0.5) * this.cs, y: b.y + (Math.floor(k / this.cw) + 0.5) * this.cs };
      this.crunch(p, this.stamp(p.x, p.y, this.R * 1.05), 1, 7);
      return p;
    }
    return null;
  },
  autoGap() { return rand(0.28, 0.7); },
  complete() {
    stats.bricks++; save();
    this.phase = 'done'; this.phaseT = 0; this.pressed = false;
    Sound.chime(0, [0, 3, 7, 10]);
    celebrate(this.brick.x + this.brick.w / 2, this.brick.y + this.brick.h / 2);
    toast(`${this.fl().name} brick crushed · ${stats.bricks} so far`);
    hud();
  },
  update(dt) {
    if (this.pend > 0 && clock - this.soundAt > 0.035) this.flush();
    const b = this.brick, fric = Math.pow(0.02, dt);
    for (let i = this.bits.length - 1; i >= 0; i--) {
      const q = this.bits[i];
      q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= fric; q.vy *= fric;
      if (q.t >= q.life) {
        // the crumb comes to rest on the foam and stays there
        const lx = q.x - b.x - this.slide, ly = q.y - b.y;
        if (lx > 0 && ly > 0 && lx < b.w && ly < b.h) { this.tg.fillStyle = q.c; this.tg.fillRect(lx, ly, q.s, q.s); }
        this.bits.splice(i, 1);
      }
    }
    const dist = this.LW + 160, dur = reduceMotion ? 0.25 : 0.8;
    if (this.phase === 'done') {
      this.phaseT += dt;
      if (this.phaseT > 0.8) { this.phase = 'out'; this.phaseT = 0; Sound.sweep(); }
    } else if (this.phase === 'out') {
      this.phaseT += dt / dur;
      this.slide = -easeIn(Math.min(1, this.phaseT)) * dist;
      if (this.phaseT >= 1) { this.fi++; this.phase = 'in'; this.build(); this.phaseT = 0; this.slide = dist; hud(); }
    } else if (this.phase === 'in') {
      this.phaseT += dt / dur;
      this.slide = (1 - easeOut(Math.min(1, this.phaseT))) * dist;
      if (this.phaseT >= 1) { this.phase = 'idle'; this.slide = 0; }
    }
  },
  draw() {
    const b = this.brick, X = b.x + this.slide, Y = b.y;
    ctx.fillStyle = 'rgba(3,14,10,.22)'; roundRect(ctx, X + 4, Y + 8, b.w + 6, b.h + b.side + 4, 8); ctx.fill();
    ctx.fillStyle = 'rgba(3,14,10,.25)'; roundRect(ctx, X + 2, Y + 5, b.w + 2, b.h + b.side, 6); ctx.fill();
    ctx.fillStyle = this.sideCol; roundRect(ctx, X, Y + b.h - 6, b.w, b.side + 6, 5); ctx.fill();
    ctx.drawImage(this.tex, X, Y, b.w, b.h);
    for (const q of this.bits) {
      const hop = Math.sin(Math.min(1, q.t / q.life) * Math.PI) * 5;
      ctx.fillStyle = 'rgba(3,14,10,.25)'; ctx.fillRect(q.x + 1, q.y + 1, q.s, q.s);
      ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y - hop, q.s, q.s);
    }
  },
  statItems() { return [[stats.crunches, 'crunches'], [stats.bricks, 'bricks crushed'], [this.fl().name, 'on the mat']]; },
  progress() { return ['Crushed', this.cells ? this.hitN / this.cells.length / this.GOAL : 0]; }
};

/* ================= TAPPING ================= */
const Tap = {
  name: 'tap', cursor: 'pointer',
  label: 'Tapping tray. Tap the objects, scratch across them, run a finger along the comb.',
  hint: 'Tap the objects, or drag across them to scratch with a fingernail. Run along the comb teeth to pluck them. Rim and centre sound different. On a touch screen you can drum with several fingers.',
  LW: 0, LH: 0, items: null, tried: null,
  pressed: false, drag: null, last: null, acc: 0, speed: 0, anim: 1,

  make() {
    const kinds = [
      { type: 'wood', name: 'maple block' },
      { type: 'glass', name: 'glass jar' },
      { type: 'comb', name: 'wide comb' },
      { type: 'ceramic', name: 'ceramic mug' },
      { type: 'tin', name: 'tin lid' },
      { type: 'sponge', name: 'sponge' }
    ];
    this.items = kinds.map(k => {
      const o = Object.assign({ x: 0, y: 0, fx: 0, fy: 0, tx: 0, ty: 0, s: 100, bump: 0 }, k);
      if (k.type === 'wood') o.grain = Array.from({ length: 9 }, (_, i) => ({ y: (i + rand(0.2, 0.8)) / 9, a: rand(1, 3.5), f: rand(0.02, 0.05), p: rand(0, TAU) }));
      if (k.type === 'sponge') o.pores = Array.from({ length: 190 }, () => ({ x: rand(-0.5, 0.5), y: rand(-0.5, 0.5), r: rand(0.005, 0.016), e: rand(0.6, 1.4) }));
      if (k.type === 'ceramic') o.specks = Array.from({ length: 34 }, () => ({ a: rand(0, TAU), r: rand(0.84, 0.99), s: rand(0.6, 1.4) }));
      if (k.type === 'comb') o.teeth = 26;
      return o;
    });
    this.tried = new Set();
  },
  build() {
    if (!this.items) this.make();
    this.layout(false);
    this.pressed = false; this.drag = null;
  },
  layout(animate) {
    const LW = this.LW, LH = this.LH, portrait = LW < LH * 0.95;
    const cols = portrait ? 2 : 3, rows = portrait ? 3 : 2, m = 18;
    const cw = (LW - 2 * m) / cols, chh = (LH - 2 * m) / rows;
    const s = clamp(Math.min(cw, chh * 1.1) * 0.74, 70, 230);
    this.items.forEach((o, n) => {
      const x = m + cw * ((n % cols) + 0.5), y = m + chh * (Math.floor(n / cols) + 0.5) - 8;
      o.s = s;
      if (animate) { o.fx = o.x; o.fy = o.y; o.tx = x; o.ty = y; }
      else { o.x = o.fx = o.tx = x; o.y = o.fy = o.ty = y; }
    });
    this.anim = animate ? 0 : 1;
  },
  shape(o) {
    const s = o.s;
    switch (o.type) {
      case 'wood': return { w: s * 0.95, h: s * 0.5 };
      case 'comb': return { w: s * 0.98, h: s * 0.36 };
      case 'sponge': return { w: s * 0.8, h: s * 0.52 };
      case 'glass': return { r: s * 0.4 };
      case 'ceramic': return { r: s * 0.33 };
      default: return { r: s * 0.38 };
    }
  },
  hitObj(o, p) {
    const sh = this.shape(o), lx = p.x - o.x, ly = p.y - o.y;
    if (sh.r) {
      if (o.type === 'ceramic' && lx > sh.r * 0.8 && lx < sh.r * 1.55 && Math.abs(ly) < sh.r * 0.35) return { d: 2 };   // the handle
      const d = Math.hypot(lx, ly) / sh.r;
      return d <= 1 ? { d } : null;
    }
    if (Math.abs(lx) > sh.w / 2 || Math.abs(ly) > sh.h / 2) return null;
    return { d: Math.max(Math.abs(lx) / (sh.w / 2), Math.abs(ly) / (sh.h / 2)) };
  },
  pick(p) {
    for (const o of this.items) { const h = this.hitObj(o, p); if (h) return [o, h]; }
    return null;
  },
  toothAt(o, x) { const sh = this.shape(o); return Math.floor((x - o.x + sh.w / 2) / (sh.w / o.teeth)); },

  tapAt(p, vel) {
    const hit = this.pick(p), pan = panOf(p.x);
    stats.taps++;
    if (!hit) {
      Sound.tap(pan, 'mat', rand(0.95, 1.05), vel * 0.8);
      addFx({ kind: 'ring', x: p.x, y: p.y, r0: 2, r1: 10, life: 0.18 });
      save(); hud();
      return;
    }
    const [o, h] = hit;
    let pitch = 1, v = vel;
    if (o.type === 'wood') pitch = 1 + h.d * 0.18;
    else if (o.type === 'glass') { if (h.d < 0.8) { pitch = 0.8; v *= 0.7; } }
    else if (o.type === 'ceramic') { if (h.d > 1) pitch = 1.3; else if (h.d < 0.8) { pitch = 0.74; v *= 0.75; } else pitch = 1.08; }
    else if (o.type === 'tin') pitch = 1 + h.d * 0.12;
    if (o.type === 'comb') {
      Sound.pluck(pan, clamp(this.toothAt(o, p.x), 0, o.teeth - 1), 0);
      Sound.tap(pan, 'comb', 1, v * 0.6);
      stats.plucks++;
    } else Sound.tap(pan, o.type, pitch * rand(0.98, 1.02), v);
    o.bump = 1;
    addFx({ kind: 'ring', x: p.x, y: p.y, r0: 3, r1: 16, life: 0.22 });
    if (pointerType === 'touch' && navigator.vibrate) { try { navigator.vibrate(5); } catch (e) {} }
    this.tried.add(o.type);
    save(); hud();
    if (this.tried.size === this.items.length) this.complete();
  },
  combCross(o, a, b) {
    const sh = this.shape(o), top = o.y - sh.h / 2 + sh.h * 0.28;
    if (Math.max(a.y, b.y) < top || Math.min(a.y, b.y) > o.y + sh.h / 2 + 4) return;
    const ia = clamp(this.toothAt(o, a.x), -1, o.teeth), ib = clamp(this.toothAt(o, b.x), -1, o.teeth);
    if (ia === ib) return;
    const lo = Math.max(0, Math.min(ia, ib) + (ib > ia ? 1 : 0)), hi = Math.min(o.teeth - 1, Math.max(ia, ib) - (ib > ia ? 0 : 1));
    const pan = panOf(b.x);
    let n = 0;
    for (let k = lo; k <= hi && n < 14; k++, n++) Sound.pluck(pan, ib > ia ? k : hi - (k - lo), n * 0.006);
    stats.plucks += n; o.bump = Math.max(o.bump, 0.5);
    if (n) { this.tried.add('comb'); hud(); save(); if (this.tried.size === this.items.length) this.complete(); }
  },
  complete() {
    Sound.chime(0, [0, 4, 7, 12, 16]);
    celebrate(this.LW / 2, this.LH / 2);
    toast('All six tapped · the table has been rearranged');
    this.tried.clear();
    for (let i = this.items.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [this.items[i], this.items[j]] = [this.items[j], this.items[i]]; }
    this.layout(true);
    hud();
  },

  down(p) {
    this.pressed = true; this.last = p;
    this.tapAt(p, 1);
    const hit = this.pick(p);
    this.drag = hit ? hit[0] : null;
  },
  extra(p) { this.tapAt(p, 0.9); },   // extra fingers drum on a touch screen
  move(p, pressed) {
    if (!pressed || !this.pressed) return;
    this.acc += Math.hypot(p.x - this.last.x, p.y - this.last.y);
    const hit = this.pick(p);
    const o = hit ? hit[0] : null;
    if (o && o.type === 'comb') this.combCross(o, this.last, p);
    this.drag = o;
    this.last = p;
  },
  up() { this.pressed = false; this.drag = null; },
  exit() { this.pressed = false; this.drag = null; Sound.silence(); },
  key() {
    const o = this.items[(Math.random() * this.items.length) | 0];
    const p = { x: o.x + rand(-0.15, 0.15) * o.s, y: o.y + rand(-0.1, 0.1) * o.s };
    this.tapAt(p, rand(0.7, 1));
    return p;
  },
  autoGap() { return Math.random() < 0.15 ? rand(0.6, 1.1) : rand(0.13, 0.35); },

  update(dt) {
    for (const o of this.items) o.bump = Math.max(0, o.bump - dt * 6);
    if (this.anim < 1) {
      this.anim = Math.min(1, this.anim + dt / (reduceMotion ? 0.2 : 0.7));
      const e = easeOut(this.anim);
      for (const o of this.items) { o.x = o.fx + (o.tx - o.fx) * e; o.y = o.fy + (o.ty - o.fy) * e; }
    }
    const inst = this.acc / Math.max(dt, 1e-3);
    this.acc = 0;
    this.speed += (inst - this.speed) * Math.min(1, dt * 12);
    let key = null;
    if (this.pressed) key = this.drag ? (this.drag.type === 'comb' ? null : this.drag.type) : 'mat';
    Sound.scratch(panOf(this.last ? this.last.x : this.LW / 2), this.speed, key);
  },

  draw() {
    for (const o of this.items) {
      const k = 1 - 0.035 * o.bump;
      ctx.save();
      ctx.translate(o.x, o.y); ctx.scale(k, k);
      this['draw_' + o.type](o);
      ctx.restore();
      ctx.font = '11px "DM Mono", ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = this.tried.has(o.type) ? 'rgba(240,191,155,.9)' : 'rgba(214,236,222,.5)';
      const sh = this.shape(o);
      ctx.fillText(o.name, o.x, o.y + (sh.r || sh.h / 2) + 22);
    }
  },
  shadowRect(x, y, w, h, r) { ctx.fillStyle = 'rgba(3,14,10,.35)'; roundRect(ctx, x + 4, y + 7, w, h, r); ctx.fill(); },
  shadowCircle(r) { ctx.fillStyle = 'rgba(3,14,10,.32)'; ctx.beginPath(); ctx.arc(4, 7, r, 0, TAU); ctx.fill(); },
  draw_wood(o) {
    const w = o.s * 0.95, h = o.s * 0.5, x = -w / 2, y = -h / 2;
    this.shadowRect(x, y, w, h, 7);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#d6a874'); g.addColorStop(1, '#b4834d');
    ctx.fillStyle = g; roundRect(ctx, x, y, w, h, 7); ctx.fill();
    ctx.save(); roundRect(ctx, x, y, w, h, 7); ctx.clip();
    ctx.strokeStyle = 'rgba(112,64,26,.3)'; ctx.lineWidth = 1.1;
    for (const L of o.grain) {
      ctx.beginPath();
      for (let u = 0; u <= w; u += 6) {
        const yy = y + L.y * h + Math.sin(u * L.f + L.p) * L.a;
        if (u === 0) ctx.moveTo(x + u, yy); else ctx.lineTo(x + u, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,238,214,.4)'; ctx.lineWidth = 1; roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 7); ctx.stroke();
  },
  draw_glass(o) {
    const r = o.s * 0.4;
    this.shadowCircle(r);
    const g = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r);
    g.addColorStop(0, 'rgba(200,232,240,.10)'); g.addColorStop(0.8, 'rgba(200,232,240,.16)'); g.addColorStop(1, 'rgba(220,242,248,.34)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(228,246,252,.5)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 0, r - 2.5, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, r - 9, 0, TAU); ctx.stroke();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 1.12 * Math.PI, 1.42 * Math.PI); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0.15 * Math.PI, 0.28 * Math.PI); ctx.stroke();
    ctx.lineCap = 'butt';
  },
  draw_ceramic(o) {
    const r = o.s * 0.33;
    this.shadowCircle(r);
    ctx.strokeStyle = '#d4c4ad'; ctx.lineWidth = r * 0.2;
    roundRect(ctx, r * 0.7, -r * 0.3, r * 0.78, r * 0.6, r * 0.28); ctx.stroke();
    ctx.fillStyle = '#eadfcd'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    const g = ctx.createRadialGradient(r * 0.15, r * 0.2, r * 0.1, 0, 0, r * 0.82);
    g.addColorStop(0, '#d8ccb8'); g.addColorStop(1, '#b6a790');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 0.82, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(90,70,50,.5)';
    for (const sp of o.specks) ctx.fillRect(Math.cos(sp.a) * r * sp.r, Math.sin(sp.a) * r * sp.r, sp.s, sp.s);
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.91, 1.1 * Math.PI, 1.5 * Math.PI); ctx.stroke();
    ctx.lineCap = 'butt';
  },
  draw_tin(o) {
    const r = o.s * 0.38;
    this.shadowCircle(r);
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.05, 0, 0, r);
    g.addColorStop(0, '#f4f6f7'); g.addColorStop(0.5, '#b8c0c5'); g.addColorStop(1, '#7c858b');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.lineWidth = 1.2;
    for (const [rr, a] of [[0.93, 0.5], [0.85, 0.28], [0.58, 0.35]]) {
      ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(0, 0, r * rr, 0, TAU); ctx.stroke();
      ctx.strokeStyle = 'rgba(40,48,52,.35)'; ctx.beginPath(); ctx.arc(0, 0, r * rr - 1.5, 0, TAU); ctx.stroke();
    }
  },
  draw_comb(o) {
    const w = o.s * 0.98, h = o.s * 0.36, x = -w / 2, y = -h / 2, n = o.teeth, tw = w / n;
    ctx.fillStyle = 'rgba(3,14,10,.3)'; ctx.fillRect(x + 4, y + 7, w, h * 0.32);
    for (let i = 0; i < n; i++) ctx.fillRect(x + 4 + i * tw + tw * 0.22, y + 7 + h * 0.28, tw * 0.56, h * 0.72);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#8a5d3b'); g.addColorStop(1, '#5e3d25');
    ctx.fillStyle = g;
    roundRect(ctx, x, y, w, h * 0.32, 4); ctx.fill();
    for (let i = 0; i < n; i++) { roundRect(ctx, x + i * tw + tw * 0.22, y + h * 0.28, tw * 0.56, h * 0.72, Math.min(tw * 0.28, 3)); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,220,180,.2)'; ctx.fillRect(x + 3, y + 3, w - 6, 2);
  },
  draw_sponge(o) {
    const w = o.s * 0.8, h = o.s * 0.52, x = -w / 2, y = -h / 2;
    this.shadowRect(x, y, w, h, 10);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#f0d06a'); g.addColorStop(1, '#d6af44');
    ctx.fillStyle = g; roundRect(ctx, x, y, w, h, 10); ctx.fill();
    ctx.save(); roundRect(ctx, x, y, w, h, 10); ctx.clip();
    ctx.fillStyle = 'rgba(150,106,18,.3)';
    for (const q of o.pores) { ctx.beginPath(); ctx.ellipse(q.x * w, q.y * h, q.r * w, q.r * w * q.e, 0, 0, TAU); ctx.fill(); }
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,244,200,.45)'; ctx.lineWidth = 1; roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 10); ctx.stroke();
  },
  statItems() {
    return [[stats.taps, 'taps'], [stats.plucks, 'comb teeth plucked'], [`${this.tried ? this.tried.size : 0}/6`, 'objects tried']];
  },
  progress() { return ['Tried', this.tried ? this.tried.size / this.items.length : 0]; }
};

/* ================= KOI POND ================= */
const KOI = [
  { name: 'Kohaku', body: '#f3eee5', spots: ['#e0523a'], fin: 'rgba(250,245,238,.5)' },
  { name: 'Yamabuki', body: '#f1bf4c', spots: ['#e39e2e'], fin: 'rgba(250,222,150,.5)' },
  { name: 'Showa', body: '#efe8dc', spots: ['#1e1b1a', '#d6462e'], fin: 'rgba(40,36,34,.45)' },
  { name: 'Asagi', body: '#8ea6b8', spots: ['#e06f3e'], fin: 'rgba(170,196,212,.5)' },
  { name: 'Platinum ogon', body: '#e8ebee', spots: ['#d0d6dc'], fin: 'rgba(242,246,250,.55)' },
  { name: 'Tancho', body: '#f5f2ec', spots: [], head: '#d6392d', fin: 'rgba(250,248,244,.55)' }
];
// inside distance (positive) of a rounded rectangle centred on the origin
function rrInside(px, py, w, h, r) {
  const qx = Math.abs(px) - (w / 2 - r), qy = Math.abs(py) - (h / 2 - r);
  return -(Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r);
}
// a point a fraction t of the way round a rounded rectangle's outline
function rrPoint(x, y, w, h, r, t) {
  const sw = w - 2 * r, sh = h - 2 * r, q = (Math.PI * r) / 2;
  let d = (((t % 1) + 1) % 1) * (2 * sw + 2 * sh + 4 * q);
  const segs = [
    [sw, s => [x + r + s, y]],
    [q, s => { const a = -Math.PI / 2 + s / r; return [x + w - r + Math.cos(a) * r, y + r + Math.sin(a) * r]; }],
    [sh, s => [x + w, y + r + s]],
    [q, s => { const a = s / r; return [x + w - r + Math.cos(a) * r, y + h - r + Math.sin(a) * r]; }],
    [sw, s => [x + w - r - s, y + h]],
    [q, s => { const a = Math.PI / 2 + s / r; return [x + r + Math.cos(a) * r, y + h - r + Math.sin(a) * r]; }],
    [sh, s => [x, y + h - r - s]],
    [q, s => { const a = Math.PI + s / r; return [x + r + Math.cos(a) * r, y + r + Math.sin(a) * r]; }]
  ];
  for (const [len, f] of segs) { if (d <= len) return f(d); d -= len; }
  return [x + r, y];
}

const Pond = {
  name: 'pond', cursor: 'pointer',
  label: 'Koi pond. Tap the water for a droplet, drag to trail a finger through it.',
  hint: 'Tap the water for a droplet, hold a moment for a bigger one, or drag a finger through it. The koi swim over to see what made the ripples. Earn their trust and another one joins. Turn on rain and watch it land.',
  LW: 0, LH: 0, koi: null, trust: 0,

  build() {
    const rw = Math.min(this.LW - 44, 780), rh = Math.min(this.LH - 44, 480);
    this.rx = (this.LW - rw) / 2; this.ry = (this.LH - rh) / 2; this.rw = rw; this.rh = rh;
    this.rad = Math.min(rw, rh) * 0.26;
    const cs = this.cs = Math.max(2.5, Math.sqrt((rw * rh) / 38000));
    const gw = this.gw = Math.ceil(rw / cs) + 1, gh = this.gh = Math.ceil(rh / cs) + 1, N = gw * gh;
    this.A = new Float32Array(N); this.B = new Float32Array(N);
    this.mask = new Uint8Array(N); this.edge = new Float32Array(N);
    for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
      const k = j * gw + i, s = rrInside(i * cs - rw / 2, j * cs - rh / 2, rw - 4, rh - 4, this.rad);
      if (s > 0) { this.mask[k] = 1; this.edge[k] = 0.55 + 0.45 * clamp(s / 34, 0, 1); }
    }
    this.off = document.createElement('canvas'); this.off.width = gw; this.off.height = gh;
    this.og = this.off.getContext('2d');
    this.img = this.og.createImageData(gw, gh);
    this.paintFloor();
    this.paintRim();
    const S = clamp(Math.min(rw, rh) / 470, 0.65, 1.1);
    if (!this.koi) {
      this.koi = [];
      const n = clamp(stats.koi || 2, 2, KOI.length);
      for (let i = 0; i < n; i++) this.koi.push(this.makeKoi(i));
    } else for (const o of this.koi) { o.L = o.L0 * S; this.placeKoi(o); }
    this.pads = [];
    for (let i = 0; i < 3; i++) {
      const p = this.randomSpot(80);
      if (this.pads.some(q => Math.hypot(q.x - p.x, q.y - p.y) < 90)) continue;
      this.pads.push({ x: p.x, y: p.y, r: rand(22, 32) * S, notch: rand(0, TAU), flower: this.pads.length === 0, t: rand(0, 10) });
    }
    this.interest = [];
    this.pressed = false; this.last = null; this.acc = 0; this.speed = 0; this.pressT = 0; this.moved = 0;
    this.energy = 1; this.leafT = rand(3, 7);
    this.render();
  },
  paintFloor() {
    const { gw, gh } = this;
    const c = document.createElement('canvas'); c.width = gw; c.height = gh;
    const g = c.getContext('2d');
    const bg = g.createRadialGradient(gw * 0.5, gh * 0.5, 0, gw * 0.5, gh * 0.5, Math.max(gw, gh) * 0.7);
    bg.addColorStop(0, '#1d4f55'); bg.addColorStop(1, '#2d6a66');
    g.fillStyle = bg; g.fillRect(0, 0, gw, gh);
    const cols = ['#8b9188', '#a59c88', '#6e7a72', '#bab3a1', '#5a665f', '#7c9383', '#9a8b76', '#c4bcaa'];
    const n = Math.floor((gw * gh) / 30);
    for (let i = 0; i < n; i++) {
      const x = Math.random() * gw, y = Math.random() * gh, r = rand(1.5, 4.5), e = rand(0.6, 1), a = rand(0, Math.PI);
      g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(x + r * 0.2, y + r * 0.25, r, r * e, a, 0, TAU); g.fill();
      g.fillStyle = cols[i % cols.length]; g.beginPath(); g.ellipse(x, y, r, r * e, a, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,.16)'; g.beginPath(); g.ellipse(x - r * 0.25, y - r * 0.3, r * 0.45, r * 0.3 * e, a, 0, TAU); g.fill();
    }

  drawKoi(o, shadow) {

      const a = sp[Math.max(0, n - 1)], b = sp[Math.min(N, n + 1)];
      let tx = a[0] - b[0], ty = a[1] - b[1];
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;

    ctx.lineTo(tail[0] + ux * fl * 0.62, tail[1] + uy * fl * 0.62);
    ctx.lineTo(tail[0] + ux * fl + uy * fw, tail[1] + uy * fl - ux * fw);
    ctx.quadraticCurveTo(tail[0] + ux * fl * 0.5 + uy * fw, tail[1] + uy * fl * 0.5 - ux * fw, tail[0], tail[1]);

        const b = sp[2], w = width(0.2), n = nrm[2];

    const t0 = [ca, sa];
    ctx.beginPath();
    ctx.moveTo(right[0][0], right[0][1]);
    ctx.quadraticCurveTo(sp[0][0] + t0[0] * L * 0.1, sp[0][1] + t0[1] * L * 0.1, left[0][0], left[0][1]);
    for (let n = 1; n <= N; n++) ctx.lineTo(left[n][0], left[n][1]);
    for (let n = N; n >= 1; n--) ctx.lineTo(right[n][0], right[n][1]);
    ctx.closePath();
    if (shadow) { ctx.fillStyle = 'rgba(4,24,26,.3)'; ctx.fill(); ctx.restore(); return; }
    ctx.globalAlpha = 0.94;
    ctx.fillStyle = o.kind.body; ctx.fill();
    ctx.save(); ctx.clip();
    for (const q of o.spots) {

      const px = a[0] + (b[0] - a[0]) * fr + nn[0] * q.l * w, py = a[1] + (b[1] - a[1]) * fr + nn[1] * q.l * w;

    ctx.fillStyle = 'rgba(20,20,24,.8)';

  },
  drawPad(pd) {
    // lily pads ride the ripples

    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);

    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, a + 0.25, a - 0.25 + TAU); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(30,60,28,.35)'; ctx.lineWidth = 0.8;
    ctx.beginPath();
    for (let v = 1; v < 9; v++) { const b = a + 0.25 + (v * (TAU - 0.5)) / 9; ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(b) * r * 0.9, y + Math.sin(b) * r * 0.9); }
    ctx.stroke();

        ctx.beginPath(); ctx.ellipse(fr * 0.5, 0, fr * 0.5, fr * 0.2, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = '#f3d36b'; ctx.beginPath(); ctx.arc(x + r * 0.15, y - r * 0.1, fr * 0.2, 0, TAU); ctx.fill();
    }
  },
  draw() {
    const c = this.cs;

    ctx.drawImage(this.off, this.rx - c / 2, this.ry - c / 2, this.gw * c, this.gh * c);
    ctx.save();
    roundRect(ctx, this.rx + 2, this.ry + 2, this.rw - 4, this.rh - 4, this.rad); ctx.clip();
    for (const o of this.koi) this.drawKoi(o, true);
    for (const o of this.koi) this.drawKoi(o, false);

    g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(0.35, 'rgba(255,255,255,0)');
    g.addColorStop(0.7, 'rgba(180,230,240,.04)'); g.addColorStop(1, 'rgba(255,255,255,0)');

  },
  statItems() { return [[stats.drops, 'droplets'], [stats.nibbles, 'koi nibbles'], [this.koi ? this.koi.length : 2, 'koi in the pond']]; },
  progress() { return this.koi && this.koi.length >= KOI.length ? ['Pond full', 1] : ['Koi trust', this.trust]; }
};

/* ================= ZEN GARDEN ================= */
function angTo(a, b, t) { const d = ((((b - a + Math.PI) % TAU) + TAU) % TAU) - Math.PI; return a + d * t; }

const Zen = {
  name: 'zen', cursor: 'none',
  label: 'Zen garden. Drag the rake through the sand; tap a stone to rake rings around it.',
  hint: 'Drag the rake to comb grooves into the sand. Tap a stone and the rake circles it. Rake most of the garden and the wind smooths it over for a fresh one. Listen for the bamboo fountain.',
  LW: 0, LH: 0,
  sands: [
    { name: 'White gravel', c: [226, 219, 202] },
    { name: 'Rose granite', c: [218, 190, 180] },
    { name: 'Black sand', c: [104, 102, 104] },
    { name: 'Golden sand', c: [228, 198, 146] }
  ],
  si: 0, SP: 7, A: 1.7, GOAL: 0.8, phase: 'idle', phaseT: 0,

  build() {
    const fw = Math.min(this.LW - 36, 820), fh = Math.min(this.LH - 36, 500), F = 16;
    this.frame = { x: (this.LW - fw) / 2, y: (this.LH - fh) / 2, w: fw, h: fh, F };

  down(p) {
