  statItems() { return [[stats.gardens, 'gardens raked'], [this.sands[this.si % this.sands.length].name, 'in the frame'], [this.stones ? this.stones.length : 0, 'stones']]; },
  progress() { return ['Raked', this.covTot ? this.covN / this.covTot / this.GOAL : 0]; }

/* ================= MECHANICAL KEYBOARD ================= */
const KB_ROWS = (() => {
  const sym = { '`': 'Backquote', '-': 'Minus', '=': 'Equal', '[': 'BracketLeft', ']': 'BracketRight', ';': 'Semicolon', "'": 'Quote', ',': 'Comma', '.': 'Period', '/': 'Slash' };

  const row = chars => [...chars].map(ch => ({ label: ch, code: code(ch), w: 1, ch: ch.toLowerCase() }));
  const mod = (label, code, w, ch = null) => ({ label, code, w, mod: true, ch });
  return [
    [...row('`1234567890-='), mod('back', 'Backspace', 2)],
    [mod('tab', 'Tab', 1.5, '  '), ...row('QWERTYUIOP[]'), { label: '\\', code: 'Backslash', w: 1.5, ch: '\\' }],
    [mod('caps', 'CapsLock', 1.75), ...row("ASDFGHJKL;'"), mod('enter', 'Enter', 2.25)],
    [mod('shift', 'ShiftLeft', 2.25), ...row('ZXCVBNM,./'), mod('shift', 'ShiftRight', 2.75)],
    [mod('ctrl', 'ControlLeft', 1.25), mod('alt', 'AltLeft', 1.25), mod('cmd', 'MetaLeft', 1.25), { label: '', code: 'Space', w: 6.25, ch: ' ', space: true }, mod('cmd', 'MetaRight', 1.25), mod('alt', 'AltRight', 1.25), mod('fn', 'ContextMenu', 1.25), mod('ctrl', 'ControlRight', 1.25)]
  ];
})();
const tintCache = new Map();
function tint(hex, f) {
  f = Math.round(f * 50) / 50;

  let v = tintCache.get(key);
  if (!v) { const [r, g, b] = hexRgb(hex); v = `rgb(${Math.min(255, r * f) | 0},${Math.min(255, g * f) | 0},${Math.min(255, b * f) | 0})`; tintCache.set(key, v); }
  return v;
}

  build() {

  release(k) {

  key() {

    else { ch = phrase[this.ac++]; k = ch === ' ' ? this.byCode.Space : this.keys.find(q => q.ch === ch) || this.byCode.Space; }

  },
  autoGap() {

  update(dt) {
    for (const r of this.ripples) r.t += dt;

  drawKey(k, b) {

  draw() {

    ctx.fillStyle = '#f2eee3'; roundRect(ctx, st.x, st.y, st.w, st.h, 6); ctx.fill();

  progress() { return ['Next board', this.onBoard / this.GOAL]; }

/* ================= ICE ================= */
const Ice = {
  name: 'ice', cursor: 'pointer',
  label: 'Ice sheet. Tap to crack it, drag to scrape it.',
  hint: 'Tap the ice to crack it; fresh ice sometimes answers with that zappy frozen-lake ring. Drag to scrape it like a skate blade. Crack enough of it and the whole sheet shatters, then a new one freezes over.',
  LW: 0, LH: 0,
  tints: [
    { name: 'Pond ice', a: '205,232,244', b: '120,172,204' },
    { name: 'Glacier blue', a: '176,218,244', b: '66,128,192' },
    { name: 'Frosted lilac', a: '226,218,248', b: '138,120,204' }
  ],
  ti: 0, GOAL: 0.55, phase: 'idle', phaseT: 0, alpha: 1,

  tint() { return this.tints[this.ti % this.tints.length]; },
  build() {
    const w = Math.round(Math.min(this.LW - 60, 660)), h = Math.round(Math.min(this.LH - 70, 410));
    this.sheet = { x: Math.round((this.LW - w) / 2), y: Math.round((this.LH - h) / 2), w, h, r: 20 };
    this.resetSheet();
    this.shards = []; this.phase = 'idle'; this.alpha = 1;
    this.pressed = false; this.last = null; this.acc = 0; this.speed = 0; this.lastHit = null;
  },
  resetSheet() {

    this.queue = [];
    this.paint();
  },
  paint() {
    const s = this.sheet, t = this.tint(), [c, g] = layer(s.w, s.h);
    this.tex = c; this.tg = g;
    g.save(); roundRect(g, 0, 0, s.w, s.h, s.r); g.clip();
    const bg = g.createLinearGradient(0, 0, s.w, s.h);
    bg.addColorStop(0, `rgba(${t.a},.72)`); bg.addColorStop(1, `rgba(${t.b},.6)`);
    g.fillStyle = bg; g.fillRect(0, 0, s.w, s.h);
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * s.w, y = Math.random() * s.h, r = rand(20, 90);
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `rgba(255,255,255,${rand(0.04, 0.12).toFixed(3)})`); rg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    const sp = ['rgba(255,255,255,.12)', 'rgba(255,255,255,.25)', 'rgba(255,255,255,.4)'];
    for (let i = 0; i < (s.w * s.h) / 60; i++) { g.fillStyle = sp[i % 3]; g.fillRect(Math.random() * s.w, Math.random() * s.h, rand(0.6, 1.6), rand(0.6, 1.6)); }
    // air bubbles frozen on their way up
    g.lineWidth = 0.8;
    for (let i = 0; i < 14; i++) {
      let x = Math.random() * s.w, y = Math.random() * s.h;
      for (let j = 0, n = 3 + ((Math.random() * 6) | 0); j < n; j++) {
        const r = rand(1.2, 3.8);
        g.strokeStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
        g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(x - r * 0.4, y - r * 0.5, 1, 1);
        x += rand(-3, 3); y -= rand(5, 11);
      }
    }
    g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 0.6;
    for (let i = 0; i < 5; i++) {
      let x = Math.random() * s.w, y = Math.random() * s.h, a = rand(0, TAU);
      g.beginPath(); g.moveTo(x, y);
      for (let j = 0; j < 18; j++) { a += rand(-0.3, 0.3); x += Math.cos(a) * 7; y += Math.sin(a) * 7; g.lineTo(x, y); }
      g.stroke();
    }
    for (let i = 0; i < 4; i++) { g.strokeStyle = `rgba(255,255,255,${0.1 + i * 0.05})`; g.lineWidth = 14 - i * 3.5; roundRect(g, 0, 0, s.w, s.h, s.r); g.stroke(); }

  inSheet(p) { const s = this.sheet; return p.x > s.x + 4 && p.y > s.y + 4 && p.x < s.x + s.w - 4 && p.y < s.y + s.h - 4; },
  crack(p, power) {

    const segs = [], S = Math.min(s.w, s.h), V = 900;
    const branch = (x, y, a, len, w, t0, depth) => {
      let dist = 0;
      while (dist < len) {

        a += rand(-0.38, 0.38);
        const nx = x + Math.cos(a) * step, ny = y + Math.sin(a) * step;

      const n = nb + 2;
      let prev = null;
      for (let i = 0; i <= n; i++) {
        const a = a0 + (i * TAU) / n, x = lx + Math.cos(a) * rr * rand(0.85, 1.15), y = ly + Math.sin(a) * rr * rand(0.85, 1.15);

    this.queue.sort((a, b) => a.at - b.at);

    const pan = panOf(p.x);
    Sound.iceHit(pan, fresh > 3);
    const step = Math.max(1, Math.floor(segs.length / 36));
    for (let i = 0; i < segs.length; i += step) Sound.crackTick(pan, segs[i].t, 1 - i / segs.length);
    if (fresh > 6 && Math.random() < 0.45) { Sound.zap(pan); stats.zaps++; }
    stats.cracks++;
    this.lastHit = p;
    addFx({ kind: 'ring', x: p.x, y: p.y, r0: 3, r1: 30, life: 0.3 });
    for (let i = 0; i < 5; i++) { const a = rand(0, TAU), v = rand(50, 140); addFx({ kind: 'speck', x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.2, 0.4) }); }

  drawSeg(sg) {

    g.strokeStyle = 'rgba(255,255,255,.92)'; g.lineWidth = sg.w * 0.7; line(0, 0);
  },
  shatter(o) {
    const s = this.sheet, cols = 8, rows = 5, pts = [];
    for (let j = 0; j <= rows; j++) for (let i = 0; i <= cols; i++) {
      const jx = i > 0 && i < cols ? rand(-0.35, 0.35) : 0, jy = j > 0 && j < rows ? rand(-0.35, 0.35) : 0;

  move(p, pressed) {

  up() { this.pressed = false; },
  extra(p) { if (this.phase === 'idle') this.crack(p, 0.8); },
  exit() { this.pressed = false; Sound.silence(); },
  key() {

  autoGap() { return rand(0.9, 1.6); },

  update(dt) {

/* ---------- wiring ---------- */
const trays = { wrap: Wrap, sand: Sand, slime: Slime, foam: Foam, tap: Tap, pond: Pond, zen: Zen, keys: Keys, ice: Ice, mic: Mic };

function fit(t) {
  if (!W || !H) return;
  let s = t.LW ? Math.min(W / t.LW, H / t.LH) : 0;
  if (!t.LW || s < 0.82 || s > 1.2 || W - t.LW * s > 100 || H - t.LH * s > 100) {
    t.LW = W; t.LH = H; t.build(); s = 1;
  }
  view.s = s; view.ox = (W - t.LW * s) / 2; view.oy = (H - t.LH * s) / 2;
}
function resize() {
  const r = stage.getBoundingClientRect();
  const nw = Math.max(1, Math.round(r.width)), nh = Math.max(1, Math.round(r.height));
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  if (nw === W && nh === H && canvas.width === Math.round(W * DPR)) return;
  W = nw; H = nh;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  drawMat();
  seedMotes();
  if (current) fit(current);
}

let hudDirty = true;

  hudDirty = false;
  if (!current) return;
  $stats.innerHTML = current.statItems().map(([v, l]) => `<span class="stat"><b>${v}</b>${l}</span>`).join('');
  const [lab, val] = current.progress(), pct = Math.floor(clamp(val, 0, 1) * 100);
  $meterLabel.textContent = lab;
  $meterFill.style.width = pct + '%';
  $meterVal.textContent = pct + '%';
}

let toastTimer = 0;
function toast(msg) {
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('show'), 2600);
}

let activePointer = null;

    b.setAttribute('aria-pressed', String(on));

  }
  canvas.setAttribute('aria-label', t.label);
  canvas.style.cursor = t.cursor;
  $hint.textContent = t.hint;
  $keysHint.hidden = !!t.typing;
  $tools.hidden = !t.tools;
  fit(t);
  hud();
  remember('tray', t.name);
}
function wake() {
  Sound.start();
  if ($ear) $ear.hidden = true;
}

/* ---------- lamp light, floating dust, the ghost hand ---------- */
const lamp = { x: 0, y: 0, px: null, py: null, seen: -10 };
const ghost = { x: 0, y: 0, tx: 0, ty: 0, a: 0 };
const auto = { on: false, t: 0.5, hold: 0 };
let motes = [];
function seedMotes() {
  if (!W) return;
  if (!lamp.x) { lamp.x = W * 0.5; lamp.y = H * 0.4; }
  motes = [];
  const n = reduceMotion ? 0 : Math.round(clamp((W * H) / 16000, 18, 48));
  for (let i = 0; i < n; i++) motes.push({ x: Math.random() * W, y: Math.random() * H, vx: rand(-4, 4), vy: rand(-7, -2), r: rand(0.5, 1.5), f: rand(0.3, 1.1), p: rand(0, TAU) });
}
function ghostTo(p) {
  if (ghost.a < 0.05) { ghost.x = p.x; ghost.y = p.y; }
  ghost.tx = p.x; ghost.ty = p.y; ghost.a = 1;
}
function drawAtmosphere(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // the lamp follows your hand, or the ghost hand, or drifts on its own
  let tx, ty;
  if (lamp.px != null && clock - lamp.seen < 3) { tx = lamp.px; ty = lamp.py; }
  else if (auto.on && ghost.a > 0.05) { tx = ghost.x * view.s + view.ox; ty = ghost.y * view.s + view.oy; }
  else { tx = W * (0.5 + Math.sin(clock * 0.11) * 0.18); ty = H * (0.42 + Math.cos(clock * 0.07) * 0.12); }
  const k = Math.min(1, dt * 3.5);
  lamp.x += (tx - lamp.x) * k; lamp.y += (ty - lamp.y) * k;
  const R = Math.hypot(W, H) * 0.72;
  const g = ctx.createRadialGradient(lamp.x, lamp.y, 0, lamp.x, lamp.y, R);
  g.addColorStop(0, 'rgba(255,214,170,.075)'); g.addColorStop(0.3, 'rgba(255,214,170,0)'); g.addColorStop(1, 'rgba(0,6,4,.36)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const m of motes) {
    m.x += (m.vx + Math.sin(clock * m.f + m.p) * 5) * dt; m.y += m.vy * dt;
    if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; }
    if (m.x < -4) m.x = W + 4; else if (m.x > W + 4) m.x = -4;
    const d = Math.hypot(m.x - lamp.x, m.y - lamp.y), a = Math.max(0, 1 - d / (R * 0.42)) * (0.35 + 0.3 * Math.sin(clock * 1.7 + m.p));
    if (a <= 0.01) continue;
    ctx.fillStyle = `rgba(255,238,214,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
  }
  if (ghost.a > 0.02) {
    const f = Math.min(1, dt * 12);
    ghost.x += (ghost.tx - ghost.x) * f; ghost.y += (ghost.ty - ghost.y) * f;
    ghost.a = auto.on ? Math.max(0.3, ghost.a - dt * 0.6) : Math.max(0, ghost.a - dt * 2);
    const gx = ghost.x * view.s + view.ox, gy = ghost.y * view.s + view.oy;
    const gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, 26);
    gg.addColorStop(0, `rgba(255,246,236,${(0.34 * ghost.a).toFixed(3)})`); gg.addColorStop(1, 'rgba(255,246,236,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(gx, gy, 26, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(255,246,236,${(0.55 * ghost.a).toFixed(3)})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(gx, gy, 11, 0, TAU); ctx.stroke();
  }
}

/* ---------- the little sound meter in the header ---------- */
const vctx = $viz ? $viz.getContext('2d') : null, vizLevels = new Float32Array(18);
function drawViz() {
  if (!vctx) return;
  const w = $viz.clientWidth, h = $viz.clientHeight;
  if (!w || !h) return;
  if ($viz.width !== Math.round(w * DPR)) { $viz.width = Math.round(w * DPR); $viz.height = Math.round(h * DPR); }
  vctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  vctx.clearRect(0, 0, w, h);
  let data = null;
  if (Sound.an && !Sound.muted) { Sound.an.getByteFrequencyData(Sound.fbuf); data = Sound.fbuf; }
  const n = vizLevels.length, bw = w / n;
  for (let i = 0; i < n; i++) {
    let v = 0;
    if (data) {
      const lo = Math.floor(Math.pow(i / n, 1.6) * 90) + 1, hi = Math.floor(Math.pow((i + 1) / n, 1.6) * 90) + 2;
      for (let q = lo; q < hi; q++) v = Math.max(v, data[q]);
      v = clamp((v - 40) / 170, 0, 1);
    }
    vizLevels[i] = Math.max(v, vizLevels[i] * 0.88);
    const bh = Math.max(1.5, vizLevels[i] * h);
    vctx.fillStyle = `rgba(240,191,155,${(0.3 + vizLevels[i] * 0.7).toFixed(2)})`;
    vctx.fillRect(i * bw + bw * 0.22, (h - bh) / 2, bw * 0.56, bh);
  }
}

/* ---------- input ---------- */
function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left - view.ox) / view.s, y: (e.clientY - r.top - view.oy) / view.s };
}
function seeLamp(e) {
  const r = canvas.getBoundingClientRect();
  lamp.px = e.clientX - r.left; lamp.py = e.clientY - r.top; lamp.seen = clock;
}
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  seeLamp(e);
  auto.hold = 2.5;
  if (activePointer !== null) {
    if (current.extra) { e.preventDefault(); wake(); current.extra(toWorld(e)); }
    return;
  }
  activePointer = e.pointerId; pointerType = e.pointerType || 'mouse';
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
  wake();
  current.down(toWorld(e));
});
canvas.addEventListener('pointermove', e => {
  if (activePointer !== null && e.pointerId !== activePointer) return;
  pointerType = e.pointerType || pointerType;
  seeLamp(e);
  const pressed = activePointer !== null;
  if (pressed) auto.hold = 2.5;
  const list = pressed && e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (list && list.length > 1) for (const ce of list) current.move(toWorld(ce), true);
  else current.move(toWorld(e), pressed);
});
const release = e => {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  current.up(toWorld(e));
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('lostpointercapture', release);
canvas.addEventListener('pointerleave', () => { lamp.seen = -10; if (activePointer === null && current.leave) current.leave(); });
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('keydown', e => {
  if (current.typing) return;
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault(); wake();
    const p = current.key();
    if (p) ghostTo(p);
  }
});
document.addEventListener('keydown', e => {
  if (current && current.typing) {
    // on the keyboard tray every key types; buttons still work with Space and Enter
    const onButton = e.target && e.target.closest && e.target.closest('button');
    if (onButton && (e.key === ' ' || e.key === 'Enter' || e.key === 'Tab')) return;
    wake();
    current.keyDown(e);
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = e.key === '0' ? 10 : parseInt(e.key, 10);
  if (n >= 1 && n <= ORDER.length) { select(ORDER[n - 1]); wake(); if (current.typing) canvas.focus({ preventScroll: true }); }
  else if (e.key === 'm' || e.key === 'M') $sound.click();
  else if (e.key === 'r' || e.key === 'R') $rain.click();
  else if (e.key === 'f' || e.key === 'F') $fire.click();
  else if (e.key === 'a' || e.key === 'A') $auto.click();
  else if (e.key === 'w' || e.key === 'W') $whisper.click();
});
document.addEventListener('keyup', e => { if (current && current.typing) current.keyUp(e); });
window.addEventListener('blur', () => { if (current && current.releaseAll) current.releaseAll(); });

for (const b of tabs) b.addEventListener('click', () => {
  wake(); select(b.dataset.tray);
  if (current.typing) canvas.focus({ preventScroll: true });
});
const toggle = (btn, fn) => btn.addEventListener('click', () => {
  const on = btn.getAttribute('aria-pressed') !== 'true';
  btn.setAttribute('aria-pressed', String(on));
  wake();
  fn(on);
});
toggle($sound, on => { Sound.setMuted(!on); remember('muted', on ? '0' : '1'); });
toggle($rain, on => Sound.setRain(on));
toggle($fire, on => Sound.setFire(on));
toggle($bin, on => { Sound.setBin(on); remember('bin', on ? '1' : '0'); });
toggle($whisper, on => Sound.setWhispers(on));
for (const b of toolBtns) b.addEventListener('click', () => {
  wake();
  for (const q of toolBtns) q.setAttribute('aria-pressed', String(q === b));
  Mic.setTool(b.dataset.tool);
});
toggle($auto, on => { auto.on = on; auto.t = 0.25; auto.hold = 0; if (!on) Sound.silence(); });
document.addEventListener('visibilitychange', () => {
  if (!Sound.ac) return;
  if (document.hidden) Sound.ac.suspend().catch(() => {});
  else Sound.ac.resume().catch(() => {});
});

let last = 0;
function frame(now) {
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
  last = now; clock += dt;
  if (auto.on && current.key) {
    auto.hold = Math.max(0, auto.hold - dt);
    if (auto.hold <= 0 && activePointer === null && (auto.t -= dt) <= 0) {
      const p = current.key();
      auto.t = current.autoGap ? current.autoGap() : rand(0.5, 1.1);
      if (p) ghostTo(p);
    }
  }
  current.update(dt);
  updateFx(dt);
  Sound.tick(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(mat, 0, 0);
  ctx.setTransform(DPR * view.s, 0, 0, DPR * view.s, DPR * view.ox, DPR * view.oy);
  current.draw();
  drawFx();
  drawAtmosphere(dt);
  drawViz();
  if (hudDirty) renderHud();
  requestAnimationFrame(frame);
}

let started = false;
function start(data) {
  if (started) return;
  started = true;
  if (recall('muted') === '1') { Sound.muted = true; $sound.setAttribute('aria-pressed', 'false'); }
  if (recall('bin') === '0') { Sound.bin = false; $bin.setAttribute('aria-pressed', 'false'); }
  resize();
  const saved = (data && data.tray) || recall('tray');
  select(trays[saved] ? saved : 'wrap');
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  else window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (W) drawMat(); });
  requestAnimationFrame(frame);
}

const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ tray: current ? current.name : 'wrap' })); } catch (e) {} }
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
